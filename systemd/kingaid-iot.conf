[Service]
Environment=KINGAI_REQUIRE_EXECD=false
Environment=KINGAI_TASK_RUN_BUDGET=16
Environment=KINGAI_DEVICE_RUNTIME_ENABLED=true
Environment=KINGAI_DEVICE_PACK_DIR=/etc/kingai/device-packs
Environment=KINGAI_DEVICE_HANDLER_ROOT=/run/kingai-device
Environment=KINGAI_DEVICE_BROKER_SOCKET=/run/kingai/device-broker.sock
Environment=KINGAI_EXECD_SOCKET=/run/kingai/device-broker.sock
Environment=KINGAI_DEVICE_HANDLER_TIMEOUT_SECONDS=20
