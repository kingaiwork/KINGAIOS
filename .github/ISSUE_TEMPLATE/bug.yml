name: Bug report
description: Report a reproducible KINGAI OS defect
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include passwords, API keys, private prompts, personal data or security exploit details here. Use the security process in SECURITY.md for vulnerabilities."
  - type: input
    id: version
    attributes:
      label: KINGAI OS version / commit
    validations:
      required: true
  - type: dropdown
    id: edition
    attributes:
      label: Edition
      options: [Server, Desktop, IoT / Edge, Build / CI, Other]
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction steps
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove secrets, private memory, prompts and personal information.
