name: KINGAI OS Stability Security Cross-Check

on:
  push:
    branches: [main]
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'configs/**'
      - 'container/**'
      - 'systemd/**'
      - 'scripts/**'
      - 'release/**'
      - '.release/**'
      - '.github/workflows/**'
      - 'go.mod'
      - 'go.sum'
  pull_request:
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'configs/**'
      - 'container/**'
      - 'systemd/**'
      - 'scripts/**'
      - 'release/**'
      - '.release/**'
      - '.github/workflows/**'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:

concurrency:
  group: kingai-stability-security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cross-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Cross-component security invariants
        run: bash scripts/cross-check-security.sh
      - name: Verify Go module integrity
        run: go mod verify
      - name: Unit and integration tests
        run: go test ./...
      - name: Static analysis
        run: go vet ./...
      - name: Race detector on security-critical packages
        run: |
          pkgs=$(go list ./internal/... | grep -E '/(approval|audit|devicepack|diagnostics|installer|memory|policy|runtime|task|tufclient|update)(/|$)' || true)
          if [[ -n "$pkgs" ]]; then
            go test -race $pkgs
          fi
      - name: Confirm release remains fail-closed for production
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          g=json.load(open('release/gates.json'))
          blocked=[k for k in ('tuf_repository','production_signing_ready','protected_branch','r2_delivery') if not g[k]]
          print('Production gates still blocked:', ', '.join(blocked) if blocked else 'none')
          # This job does not promote Stable. It only verifies that release.yml
          # will require all production gates before Stable publishing.
          PY
