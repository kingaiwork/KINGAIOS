name: Sync KINGAIOS facts to static Pages website

on:
  push:
    branches: [main]
    paths-ignore:
      - 'web/public/**'
  release:
    types: [published, edited, prereleased, released]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kingai-os-to-web-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Require least-privilege target token
        env:
          SYNC_TOKEN: ${{ secrets.KINGAI_WEB_SYNC_TOKEN }}
        run: |
          set -eu
          if [ -z "$SYNC_TOKEN" ]; then
            echo '::error::Missing KINGAI_WEB_SYNC_TOKEN. Use a fine-grained token with Contents: Read and write access to kingaiwork/Kingaiosweb only.'
            exit 1
          fi

      - name: Clone public OS source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh repo clone "$GITHUB_REPOSITORY" source -- --depth=1

      - name: Clone private static website target
        env:
          GH_TOKEN: ${{ secrets.KINGAI_WEB_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          gh repo clone kingaiwork/Kingaiosweb target -- --depth=1

      - name: Update static website facts only
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p target/public/data
          cp source/llms.txt target/public/llms.txt
          python3 - <<'PY'
          import datetime, json, os, pathlib
          version = pathlib.Path('source/VERSION').read_text(encoding='utf-8').strip()
          data = {
              'project': 'KINGAI OS',
              'website': 'https://os.kingai.work',
              'source': 'https://github.com/kingaiwork/KINGAIOS',
              'version': version,
              'stage': 'Developer Foundation / Pre-Alpha',
              'editions': ['Server', 'Desktop', 'IoT / Edge'],
              'desktop_experiences': ['KINGAI Intelligence', 'KINGAI Flow', 'KINGAI Classic'],
              'source_commit': os.environ['SOURCE_SHA'],
              'updated_at': datetime.datetime.now(datetime.timezone.utc).isoformat()
          }
          pathlib.Path('target/public/data/os.json').write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Enforce static-only website boundary
        run: |
          set -euo pipefail
          test -f target/public/index.html
          test ! -e target/.github
          test ! -e target/functions
          test ! -e target/package.json
          test ! -e target/wrangler.toml
          test ! -e target/wrangler.jsonc
          if find target -type f \( -name '*.php' -o -name '*.py' -o -name '*.go' -o -name '*.ts' -o -name '*.tsx' \) -print -quit | grep -q .; then
            echo '::error::Kingaiosweb must remain a pure static Cloudflare Pages repository.'
            exit 1
          fi

      - name: Commit static facts only
        env:
          GH_TOKEN: ${{ secrets.KINGAI_WEB_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          cd target
          git config user.name 'kingai-sync[bot]'
          git config user.email '66586837+kingaiwork@users.noreply.github.com'
          git add -- public/data/os.json public/llms.txt
          if git diff --cached --quiet; then
            echo 'No static website fact changes.'
            exit 0
          fi
          short_sha="${GITHUB_SHA:0:12}"
          git commit -m "[sync-os] static facts ${short_sha}"
          gh auth setup-git
          git push origin HEAD:main
