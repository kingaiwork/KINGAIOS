name: Sync KINGAIOS facts to static Pages website

on:
  push:
    branches: [main]
  release:
    types: [published, edited, prereleased, released]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kingai-os-to-web-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Detect least-privilege target token
        id: token
        env:
          SYNC_TOKEN: ${{ secrets.KINGAI_WEB_SYNC_TOKEN }}
        run: |
          set -eu
          if [ -z "$SYNC_TOKEN" ]; then
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'KINGAI_WEB_SYNC_TOKEN is not configured; static website sync is optional and will be skipped.'
          else
            echo 'available=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Clone OS source
        if: steps.token.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh repo clone "$GITHUB_REPOSITORY" source -- --depth=1

      - name: Clone static website target
        if: steps.token.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ secrets.KINGAI_WEB_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          gh repo clone kingaiwork/Kingaiosweb target -- --depth=1

      - name: Update source facts only
        if: steps.token.outputs.available == 'true'
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p target/public/data
          python3 - <<'PY'
          import datetime, json, os, pathlib
          version = pathlib.Path('source/VERSION').read_text(encoding='utf-8').strip()
          gates = json.loads(pathlib.Path('source/release/gates.json').read_text(encoding='utf-8'))
          data = {
              'schema': 1,
              'project': 'KINGAI OS',
              'source': 'https://github.com/kingaiwork/KINGAIOS',
              'source_commit': os.environ['SOURCE_SHA'],
              'version': version,
              'stage': 'D5 Alpha Runtime Foundation / Pre-Alpha',
              'platforms': ['Server', 'Desktop', 'IoT / Edge', 'Container'],
              'release_gates': gates,
              'updated_at': datetime.datetime.now(datetime.timezone.utc).isoformat()
          }
          pathlib.Path('target/public/data/source.json').write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Enforce pure-static website boundary
        if: steps.token.outputs.available == 'true'
        run: |
          set -euo pipefail
          test -f target/public/index.html
          test ! -e target/public/functions
          test ! -e target/public/package.json
          test ! -e target/public/wrangler.toml
          test ! -e target/public/wrangler.jsonc
          if find target/public -type f \( -name '*.php' -o -name '*.py' -o -name '*.go' -o -name '*.ts' -o -name '*.tsx' \) -print -quit | grep -q .; then
            echo '::error::Kingaiosweb public/ must remain pure static content.'
            exit 1
          fi

      - name: Commit source facts only
        if: steps.token.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ secrets.KINGAI_WEB_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          cd target
          git config user.name 'kingai-sync[bot]'
          git config user.email '66586837+kingaiwork@users.noreply.github.com'
          git add -- public/data/source.json
          if git diff --cached --quiet; then
            echo 'No static source fact changes.'
            exit 0
          fi
          short_sha="${GITHUB_SHA:0:12}"
          git commit -m "[sync-os] source facts ${short_sha}"
          gh auth setup-git
          git push origin HEAD:main
