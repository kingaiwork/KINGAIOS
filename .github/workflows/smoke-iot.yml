name: KINGAI OS IoT Edge Smoke

on:
  push:
    branches: [main]
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'configs/**'
      - 'systemd/kingaid.service'
      - 'systemd/kingaid-iot.conf'
      - 'systemd/kingaid-execd.conf'
      - 'tmpfiles/**'
      - 'distro/packages/iot.txt'
      - 'distro/overlay/**'
      - 'scripts/build-rootfs.sh'
      - 'scripts/build-iot-image.sh'
      - 'iot/**'
      - 'profiles/iot.yaml'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/smoke-iot.yml'
  pull_request:
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'configs/**'
      - 'systemd/kingaid.service'
      - 'systemd/kingaid-iot.conf'
      - 'systemd/kingaid-execd.conf'
      - 'tmpfiles/**'
      - 'distro/packages/iot.txt'
      - 'distro/overlay/**'
      - 'scripts/build-rootfs.sh'
      - 'scripts/build-iot-image.sh'
      - 'iot/**'
      - 'profiles/iot.yaml'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/smoke-iot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  edge-rootfs:
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Test governed device runtime
        run: go test ./internal/devicepack ./internal/policy ./internal/agent ./cmd/kingaid
      - name: Install cross-architecture and filesystem tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y mmdebstrap ubuntu-keyring zstd qemu-user-static binfmt-support e2fsprogs xz-utils
          sudo update-binfmts --enable qemu-aarch64 || true
      - name: Build Ubuntu 26.04 based IoT rootfs
        run: sudo --preserve-env=PATH,KINGAI_SKIP_ARCHIVE KINGAI_SKIP_ARCHIVE=1 bash scripts/build-rootfs.sh iot "${{ matrix.arch }}" dist
      - name: Validate lean governed KINGAI userspace
        run: |
          set -euo pipefail
          root="dist/rootfs-iot-${{ matrix.arch }}"
          sudo chroot "$root" /usr/bin/kingai version
          sudo test -x "$root/usr/lib/kingai/kingaid"
          sudo test -x "$root/usr/lib/kingai/kingai-update"
          sudo test ! -e "$root/usr/lib/kingai/kingai-execd"
          sudo test ! -e "$root/usr/lib/kingai/kingai-installer"
          sudo test ! -e "$root/usr/lib/kingai/kingai-recovery"
          sudo test ! -e "$root/usr/lib/systemd/system/kingai-execd.service"
          sudo test -L "$root/etc/systemd/system/multi-user.target.wants/kingaid.service"
          sudo test -L "$root/etc/systemd/system/multi-user.target.wants/kingai-update-health.service"
          sudo test -f "$root/usr/lib/systemd/system/kingaid.service.d/10-iot.conf"
          sudo test -d "$root/etc/kingai/device-packs"
          sudo test -f "$root/usr/share/kingai/iot/device-pack.schema.json"
          sudo test -f "$root/usr/share/doc/kingai-os/IOT-HANDLER-PROTOCOL.md"
          sudo test -f "$root/usr/lib/tmpfiles.d/kingai-iot.conf"
          grep -q '^Environment=KINGAI_REQUIRE_EXECD=true$' "$root/usr/lib/systemd/system/kingaid.service"
          grep -q '^Environment=KINGAI_REQUIRE_EXECD=false$' "$root/usr/lib/systemd/system/kingaid.service.d/10-iot.conf"
          grep -q '^Environment=KINGAI_TASK_RUN_BUDGET=16$' "$root/usr/lib/systemd/system/kingaid.service.d/10-iot.conf"
          grep -q '^Environment=KINGAI_DEVICE_RUNTIME_ENABLED=true$' "$root/usr/lib/systemd/system/kingaid.service.d/10-iot.conf"
          grep -q '^Environment=KINGAI_DEVICE_PACK_DIR=/etc/kingai/device-packs$' "$root/usr/lib/systemd/system/kingaid.service.d/10-iot.conf"
          grep -q '^Environment=KINGAI_DEVICE_HANDLER_ROOT=/run/kingai-device$' "$root/usr/lib/systemd/system/kingaid.service.d/10-iot.conf"
          grep -q '^Environment=KINGAI_DEVICE_BROKER_SOCKET=/run/kingai/device-broker.sock$' "$root/usr/lib/systemd/system/kingaid.service.d/10-iot.conf"
          grep -q '^Environment=KINGAI_EXECD_SOCKET=/run/kingai/device-broker.sock$' "$root/usr/lib/systemd/system/kingaid.service.d/10-iot.conf"
          grep -q '^NAME="KINGAI OS"' "$root/usr/lib/os-release"
          test "$(sudo stat -c '%u:%g' "$root/etc/kingai/device-packs")" = '0:0'
          test "$(sudo stat -c '%a' "$root/etc/kingai/device-packs")" = '755'
          test "$(sudo stat -c '%u:%g' "$root")" = '0:0'
      - name: Build generic Edge filesystem image
        run: sudo bash scripts/build-iot-image.sh "${{ matrix.arch }}" dist
      - name: Validate compressed Edge artifact
        run: |
          sudo chown -R "$USER:$USER" dist
          img=$(find dist -maxdepth 1 -name "KINGAI-OS-IoT-*-${{ matrix.arch }}.img.xz" -print -quit)
          test -s "$img"
          sha256sum -c "$img.sha256"
          python3 - "$img.manifest.json" <<'PY'
          import json, sys
          d=json.load(open(sys.argv[1]))
          assert d['product']=='KINGAI OS'
          assert d['edition']=='IoT / Edge'
          assert d['bootable'] is False
          assert d['device_pack_required'] is True
          assert d['arch'] in ('amd64','arm64')
          PY
          bytes=$(stat -c '%s' "$img")
          echo "Compressed IoT image bytes: $bytes"
          if (( bytes > 943718400 )); then echo 'IoT hard image budget exceeded (900 MiB).' >&2; exit 1; fi
