name: KINGAI OS Build-Test-Publish

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Distribution profile
        required: true
        default: server
        type: choice
        options: [server, desktop]
      channel:
        description: Release channel
        required: true
        default: dev
        type: choice
        options: [dev, beta, rc, stable]

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}
  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
  R2_BUCKET: ${{ secrets.R2_BUCKET }}
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

jobs:
  build-test-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: '1.23.x'
          cache: false
      - name: Resolve release parameters
        id: params
        shell: bash
        run: |
          profile='${{ inputs.profile }}'
          channel='${{ inputs.channel }}'
          test -n "$profile" || profile=server
          test -n "$channel" || channel=dev
          echo "profile=$profile" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - name: Install build, VM and publish tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y mmdebstrap ubuntu-keyring zstd squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin grub-common mtools qemu-system-x86 awscli jq
      - name: Build KINGAI root filesystem
        run: sudo --preserve-env=PATH,KINGAI_SKIP_ARCHIVE KINGAI_SKIP_ARCHIVE=1 bash scripts/build-rootfs.sh "${{ steps.params.outputs.profile }}" amd64 dist
      - name: Verify no build-host ownership leaked
        run: |
          root="dist/rootfs-${{ steps.params.outputs.profile }}-amd64"
          leaked=$(sudo find "$root" -xdev -mindepth 1 -uid "$(id -u)" -print -quit)
          test -z "$leaked" || { echo "build-host UID leaked into rootfs content: $leaked"; exit 1; }
          test "$(sudo stat -c '%u:%g' "$root")" = "0:0"
      - name: Build KINGAI Live ISO
        run: sudo --preserve-env=PATH bash scripts/build-live-iso.sh "${{ steps.params.outputs.profile }}" dist
      - name: Normalize artifact ownership
        run: sudo chown -R "$USER:$USER" dist
      - name: Validate artifact metadata
        id: artifact
        shell: bash
        run: |
          iso=$(find dist -maxdepth 1 -name '*.iso' -print -quit)
          test -s "$iso"
          sha256sum -c "$iso.sha256"
          manifest="$iso.manifest.json"
          jq -e '.product == "KINGAI OS" and .installable == false and .secure_boot == false' "$manifest" >/dev/null
          bytes=$(stat -c '%s' "$iso")
          echo "iso=$iso" >> "$GITHUB_OUTPUT"
          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"
          echo "bytes=$bytes" >> "$GITHUB_OUTPUT"
          if (( bytes >= 2147483648 )); then echo "large=true" >> "$GITHUB_OUTPUT"; else echo "large=false" >> "$GITHUB_OUTPUT"; fi
      - name: Gate RC and Stable channels
        shell: bash
        run: |
          channel='${{ steps.params.outputs.channel }}'
          installable=$(jq -r '.installable' '${{ steps.artifact.outputs.manifest }}')
          secure_boot=$(jq -r '.secure_boot' '${{ steps.artifact.outputs.manifest }}')
          if [[ "$channel" == rc || "$channel" == stable ]]; then
            if [[ "$installable" != true || "$secure_boot" != true ]]; then
              echo 'RC/Stable publishing is blocked until installer and Secure Boot release gates are complete.' >&2
              exit 1
            fi
          fi
      - name: QEMU BIOS boot verification
        shell: bash
        run: |
          iso='${{ steps.artifact.outputs.iso }}'
          set +e
          timeout 150 qemu-system-x86_64 -m 2048 -smp 2 -cdrom "$iso" -boot d -display none -serial stdio -no-reboot -snapshot > qemu-release.log 2>&1
          code=$?
          set -e
          cat qemu-release.log
          if [[ $code -ne 0 && $code -ne 124 ]]; then exit "$code"; fi
          grep -Eiq 'Linux version|casper|KINGAI|systemd' qemu-release.log
          grep -Fq 'KINGAI OS 0.1 Developer Foundation' qemu-release.log
          if grep -Eiq "Failed to start casper-md5check|can't execute '/usr/sbin/install-keymap'|update-notifier/.+No such file|var/crash/crash.init.+No such file" qemu-release.log; then
            echo 'Live-session compatibility regression detected.' >&2
            exit 1
          fi
      - name: Prepare release identity
        id: release
        shell: bash
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          profile='${{ steps.params.outputs.profile }}'
          channel='${{ steps.params.outputs.channel }}'
          tag="v${version}-${profile}-${channel}.${GITHUB_RUN_NUMBER}"
          title="KINGAI OS ${version} ${profile^} ${channel^} Preview"
          cat > release-notes.md <<EOF
          # KINGAI OS ${version} — ${profile^} ${channel^} Preview

          This is a **Developer Preview / Pre-release**, not a production Stable release.

          - Profile: ${profile}
          - Architecture: amd64
          - Channel: ${channel}
          - Source commit: ${GITHUB_SHA}
          - Install-to-disk: disabled in this Developer Foundation image
          - Secure Boot production signing: not enabled yet
          - Update trust: signed-manifest verification foundation included
          - Agent policy: local peer identity + manifest + central capability policy

          The image was rebuilt from source in this workflow and passed checksum and QEMU boot verification before publication.
          EOF
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"
      - name: Publish small ISO to GitHub Pre-release
        if: steps.artifact.outputs.large == 'false'
        shell: bash
        run: |
          gh release create '${{ steps.release.outputs.tag }}' \
            --target "$GITHUB_SHA" \
            --title '${{ steps.release.outputs.title }}' \
            --notes-file release-notes.md \
            --prerelease \
            '${{ steps.artifact.outputs.iso }}' \
            '${{ steps.artifact.outputs.iso }}.sha256' \
            '${{ steps.artifact.outputs.manifest }}'
      - name: Validate R2 credentials for large ISO
        if: steps.artifact.outputs.large == 'true'
        shell: bash
        run: |
          : "${R2_ACCOUNT_ID:?R2_ACCOUNT_ID secret is required for >=2GiB artifacts}"
          : "${R2_BUCKET:?R2_BUCKET secret is required for >=2GiB artifacts}"
          : "${AWS_ACCESS_KEY_ID:?R2_ACCESS_KEY_ID secret is required for >=2GiB artifacts}"
          : "${AWS_SECRET_ACCESS_KEY:?R2_SECRET_ACCESS_KEY secret is required for >=2GiB artifacts}"
      - name: Publish large ISO to R2
        if: steps.artifact.outputs.large == 'true'
        env:
          R2_PREFIX: ${{ steps.params.outputs.channel }}
        run: |
          bash scripts/publish-artifact.sh '${{ steps.artifact.outputs.iso }}'
          version=$(tr -d '[:space:]' < VERSION)
          name=$(basename '${{ steps.artifact.outputs.iso }}')
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          export AWS_DEFAULT_REGION=auto AWS_EC2_METADATA_DISABLED=true
          aws s3 cp '${{ steps.artifact.outputs.manifest }}' "s3://${R2_BUCKET}/${{ steps.params.outputs.channel }}/${version}/${name}.manifest.json" --endpoint-url "$endpoint" --only-show-errors
      - name: Create metadata-only GitHub Pre-release for R2 image
        if: steps.artifact.outputs.large == 'true'
        shell: bash
        run: |
          cat >> release-notes.md <<EOF

          The ISO exceeds the GitHub single-asset threshold and was routed to the KINGAI R2 release store. Public delivery is intended to be exposed through os.kingai.work.
          EOF
          gh release create '${{ steps.release.outputs.tag }}' \
            --target "$GITHUB_SHA" \
            --title '${{ steps.release.outputs.title }}' \
            --notes-file release-notes.md \
            --prerelease \
            '${{ steps.artifact.outputs.iso }}.sha256' \
            '${{ steps.artifact.outputs.manifest }}'
