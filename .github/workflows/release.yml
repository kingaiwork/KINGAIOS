name: KINGAI OS Build-Test-Publish

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Distribution profile
        required: true
        default: server
        type: choice
        options: [server, desktop]
      channel:
        description: Release channel
        required: true
        default: dev
        type: choice
        options: [dev, beta, rc, stable]
  push:
    branches: [main]
    paths:
      - '.release/server-dev.json'

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  R2_BUCKET: ${{ secrets.R2_BUCKET }}
  KINGAI_WRANGLER_VERSION: '4.94.0'

jobs:
  build-test-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Resolve release parameters
        id: params
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then profile=server; channel=dev; else profile='${{ inputs.profile }}'; channel='${{ inputs.channel }}'; test -n "$profile" || profile=server; test -n "$channel" || channel=dev; fi
          echo "profile=$profile" >> "$GITHUB_OUTPUT"; echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - name: Run core release tests
        run: |
          go mod verify
          go test ./...
          go vet ./...
          python3 -m py_compile scripts/generate-sbom.py
          bash -n scripts/*.sh desktop/welcome/*.sh
      - name: Install build and VM tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y mmdebstrap ubuntu-keyring zstd squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin grub-common mtools qemu-system-x86 ovmf jq
      - name: Build KINGAI root filesystem
        run: sudo --preserve-env=PATH,KINGAI_SKIP_ARCHIVE KINGAI_SKIP_ARCHIVE=1 bash scripts/build-rootfs.sh "${{ steps.params.outputs.profile }}" amd64 dist
      - name: Verify no build-host ownership leaked
        run: |
          root="dist/rootfs-${{ steps.params.outputs.profile }}-amd64"
          leaked=$(sudo find "$root" -xdev -mindepth 1 -uid "$(id -u)" -print -quit)
          test -z "$leaked" || { echo "build-host UID leaked into rootfs content: $leaked"; exit 1; }
          test "$(sudo stat -c '%u:%g' "$root")" = "0:0"
      - name: Build KINGAI Live ISO
        run: sudo --preserve-env=PATH bash scripts/build-live-iso.sh "${{ steps.params.outputs.profile }}" dist
      - name: Normalize artifact ownership
        run: sudo chown -R "$USER:$USER" dist
      - name: Validate artifact metadata and SPDX SBOM
        id: artifact
        shell: bash
        run: |
          iso=$(find dist -maxdepth 1 -name '*.iso' -print -quit); test -s "$iso"; sha256sum -c "$iso.sha256"
          manifest="$iso.manifest.json"; sbom="$iso.spdx.json"; test -s "$sbom"
          jq -e '.spdxVersion == "SPDX-2.3" and .SPDXID == "SPDXRef-DOCUMENT"' "$sbom" >/dev/null
          jq -e '.product == "KINGAI OS" and .sbom.format == "SPDX-2.3"' "$manifest" >/dev/null
          test "$(jq -r '.sbom.sha256' "$manifest")" = "$(sha256sum "$sbom" | awk '{print $1}')"
          bytes=$(stat -c '%s' "$iso")
          echo "iso=$iso" >> "$GITHUB_OUTPUT"; echo "manifest=$manifest" >> "$GITHUB_OUTPUT"; echo "sbom=$sbom" >> "$GITHUB_OUTPUT"; echo "bytes=$bytes" >> "$GITHUB_OUTPUT"
          if (( bytes >= 2147483648 )); then echo "large=true" >> "$GITHUB_OUTPUT"; else echo "large=false" >> "$GITHUB_OUTPUT"; fi
      - name: Gate Beta RC and Stable channels
        shell: bash
        run: |
          channel='${{ steps.params.outputs.channel }}'
          if [[ "$channel" == beta || "$channel" == rc || "$channel" == stable ]]; then
            test -f release/gates.json || { echo 'non-dev release requires release/gates.json' >&2; exit 1; }
            jq -e '.installer_vm==true and .ab_update_vm==true and .recovery_vm==true and .tuf_client==true' release/gates.json >/dev/null || { echo 'Beta gate incomplete' >&2; exit 1; }
          fi
          if [[ "$channel" == rc || "$channel" == stable ]]; then
            jq -e '.secure_boot_vm==true and .tuf_repository==true and .production_signing_ready==true' release/gates.json >/dev/null || { echo 'RC/Stable trust gates incomplete' >&2; exit 1; }
          fi
          if [[ "$channel" == stable ]]; then
            jq -e '.protected_branch==true and .rollback_drill==true and .recovery_drill==true and .r2_delivery==true' release/gates.json >/dev/null || { echo 'Stable governance/delivery gates incomplete' >&2; exit 1; }
          fi
      - name: Reject stale verification evidence
        shell: bash
        run: bash scripts/check-release-gate-freshness.sh '${{ steps.params.outputs.channel }}' '${{ steps.params.outputs.profile }}'
      - name: QEMU BIOS boot verification
        shell: bash
        run: |
          iso='${{ steps.artifact.outputs.iso }}'; set +e
          timeout 150 qemu-system-x86_64 -m 2048 -smp 2 -cdrom "$iso" -boot d -display none -serial stdio -no-reboot -snapshot > qemu-bios-release.log 2>&1; code=$?; set -e; cat qemu-bios-release.log
          if [[ $code -ne 0 && $code -ne 124 ]]; then exit "$code"; fi
          grep -Eiq 'Linux version|casper|KINGAI|systemd' qemu-bios-release.log
          if grep -Eiq "Failed to start casper-md5check|can't execute '/usr/sbin/install-keymap'|update-notifier/.+No such file|var/crash/crash.init.+No such file" qemu-bios-release.log; then echo 'BIOS live-session compatibility regression detected.' >&2; exit 1; fi
      - name: QEMU UEFI boot verification
        shell: bash
        run: |
          iso='${{ steps.artifact.outputs.iso }}'; code_file=/usr/share/OVMF/OVMF_CODE_4M.fd; vars_file=/usr/share/OVMF/OVMF_VARS_4M.fd
          if [[ ! -f "$code_file" || ! -f "$vars_file" ]]; then code_file=/usr/share/OVMF/OVMF_CODE.fd; vars_file=/usr/share/OVMF/OVMF_VARS.fd; fi
          test -f "$code_file"; test -f "$vars_file"; cp "$vars_file" ovmf-release-vars.fd; set +e
          timeout 150 qemu-system-x86_64 -machine q35 -m 2048 -smp 2 -drive if=pflash,format=raw,readonly=on,file="$code_file" -drive if=pflash,format=raw,file=ovmf-release-vars.fd -cdrom "$iso" -boot d -display none -serial stdio -no-reboot -snapshot > qemu-uefi-release.log 2>&1; code=$?; set -e; cat qemu-uefi-release.log
          if [[ $code -ne 0 && $code -ne 124 ]]; then exit "$code"; fi
          grep -Eiq 'Linux version|casper|KINGAI|systemd' qemu-uefi-release.log
      - name: Prepare release identity
        id: release
        shell: bash
        run: |
          version=$(tr -d '[:space:]' < VERSION); profile='${{ steps.params.outputs.profile }}'; channel='${{ steps.params.outputs.channel }}'; base_version="${version%-$channel}"
          tag="v${base_version}-${profile}-${channel}.${GITHUB_RUN_NUMBER}"; title="KINGAI OS ${base_version} ${profile^} ${channel^} Preview"
          cat > release-notes.md <<EOF
          # KINGAI OS ${base_version} — ${profile^} ${channel^} Preview

          - Profile: ${profile}
          - Architecture: amd64
          - Channel: ${channel}
          - Source commit: ${GITHUB_SHA}
          - BIOS and UEFI boot: verified in this workflow
          - SPDX 2.3 SBOM: included
          - A/B, installer, Recovery and TUF gates: enforced by channel policy and commit-aware evidence freshness
          - Production signing secrets: never embedded in source
          EOF
          echo "tag=$tag" >> "$GITHUB_OUTPUT"; echo "title=$title" >> "$GITHUB_OUTPUT"
      - name: Publish small ISO to GitHub Pre-release
        if: steps.artifact.outputs.large == 'false'
        shell: bash
        run: |
          gh release create '${{ steps.release.outputs.tag }}' --target "$GITHUB_SHA" --title '${{ steps.release.outputs.title }}' --notes-file release-notes.md --prerelease '${{ steps.artifact.outputs.iso }}' '${{ steps.artifact.outputs.iso }}.sha256' '${{ steps.artifact.outputs.manifest }}' '${{ steps.artifact.outputs.sbom }}'
      - name: Validate Wrangler R2 environment for large ISO
        if: steps.artifact.outputs.large == 'true'
        shell: bash
        run: |
          : "${CLOUDFLARE_API_TOKEN:?CLOUDFLARE_API_TOKEN secret is required for >=2GiB artifacts}"
          : "${CLOUDFLARE_ACCOUNT_ID:?CLOUDFLARE_ACCOUNT_ID secret is required for >=2GiB artifacts}"
          : "${R2_BUCKET:?R2_BUCKET secret is required for >=2GiB artifacts}"
          node --version; npx --yes "wrangler@${KINGAI_WRANGLER_VERSION}" --version
      - name: Publish large ISO and metadata to R2
        if: steps.artifact.outputs.large == 'true'
        env:
          R2_PREFIX: ${{ steps.params.outputs.channel }}
        run: bash scripts/publish-artifact.sh '${{ steps.artifact.outputs.iso }}'
      - name: Create metadata-only GitHub Pre-release for R2 image
        if: steps.artifact.outputs.large == 'true'
        shell: bash
        run: |
          cat >> release-notes.md <<EOF

          The ISO exceeds GitHub's single-asset route and was published to the KINGAI R2 release store via pinned Wrangler v4 remote object uploads. Public delivery is intended through os.kingai.work.
          EOF
          gh release create '${{ steps.release.outputs.tag }}' --target "$GITHUB_SHA" --title '${{ steps.release.outputs.title }}' --notes-file release-notes.md --prerelease '${{ steps.artifact.outputs.iso }}.sha256' '${{ steps.artifact.outputs.manifest }}' '${{ steps.artifact.outputs.sbom }}'
