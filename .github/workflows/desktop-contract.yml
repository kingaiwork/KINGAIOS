name: KINGAI OS Desktop Contract

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "profiles/desktop.yaml"
      - "internal/desktop/**"
      - "internal/desktopbridge/**"
      - "internal/memory/**"
      - "internal/statuspub/**"
      - "cmd/kingai/**"
      - "cmd/kingai-desktop-bridge/**"
      - "cmd/kingaid/**"
      - "scripts/validate-desktop.sh"
      - "scripts/validate-desktop-private.sh"
      - "scripts/test-desktop-intelligence-launcher.sh"
      - "scripts/build-rootfs.sh"
      - "distro/overlay/usr/share/applications/kingai-intelligence.desktop"
      - "distro/overlay/usr/share/applications/kingai-desktop-experience.desktop"
      - "distro/overlay/usr/lib/systemd/user/kingai-desktop-bridge.service"
      - "distro/overlay/etc/xdg/autostart/kingai-desktop-bridge.desktop"
      - "distro/overlay/etc/xdg/mimeapps.list"
      - "Makefile"
      - ".github/workflows/desktop-contract.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "profiles/desktop.yaml"
      - "internal/desktop/**"
      - "internal/desktopbridge/**"
      - "internal/memory/**"
      - "internal/statuspub/**"
      - "cmd/kingai/**"
      - "cmd/kingai-desktop-bridge/**"
      - "cmd/kingaid/**"
      - "scripts/validate-desktop.sh"
      - "scripts/validate-desktop-private.sh"
      - "scripts/test-desktop-intelligence-launcher.sh"
      - "scripts/build-rootfs.sh"
      - "distro/overlay/usr/share/applications/kingai-intelligence.desktop"
      - "distro/overlay/usr/share/applications/kingai-desktop-experience.desktop"
      - "distro/overlay/usr/lib/systemd/user/kingai-desktop-bridge.service"
      - "distro/overlay/etc/xdg/autostart/kingai-desktop-bridge.desktop"
      - "distro/overlay/etc/xdg/mimeapps.list"
      - "Makefile"
      - ".github/workflows/desktop-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Validate Desktop product and private-data contracts
        run: make desktop-validate
      - name: Validate first-run shell transaction
        run: |
          bash -n desktop/welcome/launch.sh
          grep -q 'StandardPaths.CacheLocation' desktop/welcome/Main.qml
          ! grep -q 'kingai-desktop.ini' desktop/welcome/Main.qml
          grep -q 'desktop set "\$selected"' desktop/welcome/launch.sh
      - name: Build Desktop binaries
        run: |
          go build -trimpath -o /tmp/kingai ./cmd/kingai
          go build -trimpath -o /tmp/kingaid ./cmd/kingaid
          go build -trimpath -o /tmp/kingai-desktop-bridge ./cmd/kingai-desktop-bridge
          /tmp/kingai-desktop-bridge version
      - name: Verify Desktop CLI catalog
        run: |
          test "$(/tmp/kingai desktop list | wc -l)" -eq 3
          /tmp/kingai desktop list | grep -q '^kingai-intelligence[[:space:]]\+KINGAI Intelligence$'
          /tmp/kingai desktop list | grep -q '^kingai-flow[[:space:]]\+KINGAI Flow$'
          /tmp/kingai desktop list | grep -q '^kingai-classic[[:space:]]\+KINGAI Classic$'
      - name: Verify Intelligence private centers
        run: |
          test -f desktop/intelligence/Main.qml
          test -f desktop/intelligence/MetricCard.qml
          test -f desktop/intelligence/TaskCenter.qml
          test -f desktop/intelligence/MemoryCenter.qml
          test -f desktop/intelligence/launch.sh
          grep -q 'kingai://approvals' desktop/plasmoids/org.kingai.agentcenter/contents/ui/main.qml
          grep -q 'StandardPaths.RuntimeLocation' desktop/intelligence/TaskCenter.qml
          grep -q 'StandardPaths.RuntimeLocation' desktop/intelligence/MemoryCenter.qml
          grep -q '/kingai/desktop-private.json' desktop/intelligence/TaskCenter.qml
          grep -q '/kingai/desktop-private.json' desktop/intelligence/MemoryCenter.qml
          grep -q 'MemoryCenter {' desktop/intelligence/Main.qml
          grep -q '^MimeType=x-scheme-handler/kingai;' distro/overlay/usr/share/applications/kingai-intelligence.desktop
          grep -q '^x-scheme-handler/kingai=kingai-intelligence.desktop$' distro/overlay/etc/xdg/mimeapps.list
          grep -q '^RestrictAddressFamilies=AF_UNIX$' distro/overlay/usr/lib/systemd/user/kingai-desktop-bridge.service
