name: KINGAI OS Desktop Contract

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "profiles/desktop.yaml"
      - "internal/desktop/**"
      - "cmd/kingai/**"
      - "scripts/validate-desktop.sh"
      - "distro/overlay/usr/share/applications/kingai-intelligence.desktop"
      - "distro/overlay/etc/xdg/mimeapps.list"
      - "Makefile"
      - ".github/workflows/desktop-contract.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "profiles/desktop.yaml"
      - "internal/desktop/**"
      - "cmd/kingai/**"
      - "scripts/validate-desktop.sh"
      - "distro/overlay/usr/share/applications/kingai-intelligence.desktop"
      - "distro/overlay/etc/xdg/mimeapps.list"
      - "Makefile"
      - ".github/workflows/desktop-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Validate single Desktop edition contract
        run: bash scripts/validate-desktop.sh
      - name: Validate first-run shell transaction
        run: |
          bash -n desktop/welcome/launch.sh
          grep -q 'StandardPaths.CacheLocation' desktop/welcome/Main.qml
          ! grep -q 'kingai-desktop.ini' desktop/welcome/Main.qml
          grep -q 'desktop set "\$selected"' desktop/welcome/launch.sh
      - name: Test Desktop experience manager
        run: go test ./internal/desktop
      - name: Build KINGAI CLI with Desktop commands
        run: go build -trimpath -o /tmp/kingai ./cmd/kingai
      - name: Verify Desktop CLI catalog
        run: |
          test "$(/tmp/kingai desktop list | wc -l)" -eq 3
          /tmp/kingai desktop list | grep -q '^kingai-intelligence[[:space:]]\+KINGAI Intelligence$'
          /tmp/kingai desktop list | grep -q '^kingai-flow[[:space:]]\+KINGAI Flow$'
          /tmp/kingai desktop list | grep -q '^kingai-classic[[:space:]]\+KINGAI Classic$'
      - name: Verify Intelligence app contract
        run: |
          test -f desktop/intelligence/Main.qml
          test -f desktop/intelligence/launch.sh
          bash -n desktop/intelligence/launch.sh
          grep -q 'kingai://approvals' desktop/plasmoids/org.kingai.agentcenter/contents/ui/main.qml
          grep -q '^MimeType=x-scheme-handler/kingai;' distro/overlay/usr/share/applications/kingai-intelligence.desktop
          grep -q '^x-scheme-handler/kingai=kingai-intelligence.desktop$' distro/overlay/etc/xdg/mimeapps.list
