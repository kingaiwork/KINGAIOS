name: KINGAI OS Desktop A-B Upgrade Smoke

on:
  push:
    branches: [main]
    paths:
      - 'internal/update/**'
      - 'cmd/kingai-update/**'
      - 'internal/installer/**'
      - 'cmd/kingai-installer/**'
      - 'distro/packages/desktop.txt'
      - 'distro/packages/installer-common.txt'
      - 'distro/packages/installer-amd64.txt'
      - 'distro/overlay/**'
      - 'scripts/build-rootfs.sh'
      - '.github/workflows/smoke-desktop-ab-update.yml'
  workflow_dispatch:

concurrency:
  group: kingai-desktop-ab-update-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  install-stage-boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Install image and VM tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            mmdebstrap ubuntu-keyring zstd \
            grub-pc-bin grub-efi-amd64-bin grub-common grub2-common mtools \
            gdisk parted dosfstools e2fsprogs cryptsetup-bin rsync \
            qemu-utils qemu-system-x86 ovmf jq

      - name: Compile and unit-test update engine
        run: |
          go mod verify
          go test ./...
          go vet ./...
          mkdir -p ci
          go build -trimpath -o ci/kingai-installer ./cmd/kingai-installer
          go build -trimpath -o ci/kingai-update ./cmd/kingai-update
          sudo --preserve-env=PATH go test ./internal/update -run '^TestPreserveDesktopIdentityAcrossABSlot$' -count=1

      - name: Build Desktop root filesystem
        run: sudo --preserve-env=PATH,KINGAI_SKIP_ARCHIVE KINGAI_SKIP_ARCHIVE=1 bash scripts/build-rootfs.sh desktop amd64 dist

      - name: Inject post-upgrade boot proof
        shell: bash
        run: |
          root=dist/rootfs-desktop-amd64
          sudo tee "$root/usr/lib/kingai/kingai-desktop-ab-smoke" >/dev/null <<'EOF'
          #!/bin/sh
          set -eu
          grep -q 'VERSION_ID="0.1.1-ci"' /usr/lib/os-release
          mountpoint -q /var/lib/kingai-state
          mountpoint -q /home
          test -e /dev/mapper/KINGAI_STATE
          id kingai >/dev/null
          test "$(id -u kingai):$(id -g kingai)" = 1000:1000
          test "$(stat -c '%u:%g' /home/kingai)" = 1000:1000
          grep -q '^kingai:\$6\$upgrade-ci\$' /etc/shadow
          grep -q '^id=KINGAI Upgrade WiFi$' /etc/NetworkManager/system-connections/upgrade-ci.nmconnection
          test "$(cat /etc/hostname)" = kingai-upgrade-ci
          test "$(tr -d '\n' </etc/machine-id)" = 11111111111111111111111111111111
          test ! -e /usr/share/applications/kingai-installer.desktop
          systemctl is-active --quiet sddm.service
          echo KINGAI_DESKTOP_AB_VERSION_OK > /dev/ttyS0
          echo KINGAI_DESKTOP_AB_USER_OK > /dev/ttyS0
          echo KINGAI_DESKTOP_AB_HOME_OK > /dev/ttyS0
          echo KINGAI_DESKTOP_AB_WIFI_OK > /dev/ttyS0
          echo KINGAI_DESKTOP_AB_SDDM_OK > /dev/ttyS0
          EOF
          sudo chmod 0755 "$root/usr/lib/kingai/kingai-desktop-ab-smoke"
          sudo tee "$root/usr/lib/systemd/system/kingai-desktop-ab-smoke.service" >/dev/null <<'EOF'
          [Unit]
          Description=KINGAI Desktop A-B update persistence proof
          Requires=sddm.service
          After=local-fs.target sddm.service

          [Service]
          Type=oneshot
          ExecStart=/usr/lib/kingai/kingai-desktop-ab-smoke

          [Install]
          WantedBy=graphical.target
          EOF
          sudo mkdir -p "$root/etc/systemd/system/graphical.target.wants"
          sudo ln -sfn /usr/lib/systemd/system/kingai-desktop-ab-smoke.service \
            "$root/etc/systemd/system/graphical.target.wants/kingai-desktop-ab-smoke.service"

      - name: Create disposable installed-PC disk
        run: |
          truncate -s 48G ci/desktop-ab.raw
          sudo modprobe nbd max_part=16
          sudo qemu-nbd --connect=/dev/nbd0 --format=raw ci/desktop-ab.raw
          sudo udevadm settle
          head -c 64 /dev/urandom > ci/state.key
          printf 'KINGAI-Desktop-CI-Password-2026!\n' > ci/user.password
          chmod 600 ci/state.key ci/user.password

      - name: Install Desktop A-B base system
        shell: bash
        run: |
          sudo env \
            KINGAI_INSTALLER_ALLOW_WRITE=1 \
            KINGAI_INSTALLER_CI=1 \
            KINGAI_INSTALLER_TEST_PERSIST_KEY=1 \
            ci/kingai-installer execute \
              --target /dev/nbd0 \
              --profile desktop \
              --source-root "$PWD/dist/rootfs-desktop-amd64" \
              --state-key "$PWD/ci/state.key" \
              --confirm ERASE:/dev/nbd0 > ci/install.json
          jq -e '.active_slot == "A" and .profile == "desktop"' ci/install.json >/dev/null
          sudo bash distro/overlay/usr/lib/kingai/kingai-configure-desktop-install \
            --target /dev/nbd0 \
            --state-key "$PWD/ci/state.key" \
            --username kingai \
            --hostname kingai-base-ci \
            --user-password-file "$PWD/ci/user.password" \
            --locale C.UTF-8 \
            --timezone UTC

      - name: Simulate real user and machine changes on active Slot A
        shell: bash
        run: |
          mkdir -p ci/active
          sudo mount /dev/nbd0p2 ci/active
          sudo python3 - <<'PY'
          from pathlib import Path
          root=Path('ci/active')
          shadow=root/'etc/shadow'
          lines=[]
          for line in shadow.read_text().splitlines():
              if line.startswith('kingai:'):
                  parts=line.split(':')
                  parts[1]='$6$upgrade-ci$SYNCHRONIZEDHASH'
                  line=':'.join(parts)
              lines.append(line)
          shadow.write_text('\n'.join(lines)+'\n')
          shadow.chmod(0o600)
          (root/'etc/hostname').write_text('kingai-upgrade-ci\n')
          (root/'etc/machine-id').write_text('11111111111111111111111111111111\n')
          nm=root/'etc/NetworkManager/system-connections'
          nm.mkdir(parents=True, exist_ok=True)
          con=nm/'upgrade-ci.nmconnection'
          con.write_text('[connection]\nid=KINGAI Upgrade WiFi\ntype=wifi\n[802-11-wireless]\nssid=KINGAI-CI\n')
          con.chmod(0o600)
          PY
          sudo sync
          sudo umount ci/active

      - name: Convert build root into a newer verified Desktop payload
        shell: bash
        run: |
          root=dist/rootfs-desktop-amd64
          sudo python3 - <<'PY'
          from pathlib import Path
          for rel in ('usr/lib/os-release','etc/os-release'):
              p=Path('dist/rootfs-desktop-amd64')/rel
              if not p.exists():
                  continue
              text=p.read_text()
              lines=[]
              seen=False
              for line in text.splitlines():
                  if line.startswith('VERSION_ID='):
                      line='VERSION_ID="0.1.1-ci"'
                      seen=True
                  lines.append(line)
              if not seen:
                  lines.append('VERSION_ID="0.1.1-ci"')
              p.write_text('\n'.join(lines)+'\n')
          PY
          grep -q 'VERSION_ID="0.1.1-ci"' "$root/usr/lib/os-release"

      - name: Stage A to B update while preserving human state
        shell: bash
        run: |
          sudo env \
            KINGAI_UPDATE_ALLOW_WRITE=1 \
            KINGAI_UPDATE_CI=1 \
            ci/kingai-update stage \
              --target-disk /dev/nbd0 \
              --source-root "$PWD/dist/rootfs-desktop-amd64" \
              --state-key "$PWD/ci/state.key" \
              --target-version 0.1.1-ci \
              --confirm UPDATE:/dev/nbd0 > ci/update.json
          jq -e '.from_slot == "A" and .target_slot == "B" and .target_version == "0.1.1-ci"' ci/update.json >/dev/null

      - name: Validate staged Slot B before boot
        shell: bash
        run: |
          mkdir -p ci/target ci/state
          sudo mount /dev/nbd0p3 ci/target
          grep -q 'VERSION_ID="0.1.1-ci"' ci/target/usr/lib/os-release
          grep -q '^kingai:x:1000:1000:' ci/target/etc/passwd
          grep -q '^kingai:\$6\$upgrade-ci\$SYNCHRONIZEDHASH:' ci/target/etc/shadow
          grep -Eq '^sudo:[^:]*:27:.*kingai' ci/target/etc/group
          grep -Fq '/var/lib/kingai-state/home /home none bind,' ci/target/etc/fstab
          test "$(cat ci/target/etc/hostname)" = kingai-upgrade-ci
          test "$(tr -d '\n' <ci/target/etc/machine-id)" = 11111111111111111111111111111111
          grep -q '^id=KINGAI Upgrade WiFi$' ci/target/etc/NetworkManager/system-connections/upgrade-ci.nmconnection
          test "$(stat -c '%a' ci/target/etc/NetworkManager/system-connections/upgrade-ci.nmconnection)" = 600
          test ! -e ci/target/usr/share/applications/kingai-installer.desktop
          sudo umount ci/target

          sudo cryptsetup open --key-file ci/state.key /dev/nbd0p4 kingai-ab-state-check
          sudo mount /dev/mapper/kingai-ab-state-check ci/state
          sudo test -d ci/state/home/kingai
          test "$(sudo stat -c '%u:%g' ci/state/home/kingai)" = 1000:1000
          jq -e '.active_slot == "A" and .pending_slot == "B" and .pending_version == "0.1.1-ci" and .confirmed == false' ci/state/kingai/update/slots.json >/dev/null
          sudo umount ci/state
          sudo cryptsetup close kingai-ab-state-check

      - name: Disconnect NBD target
        run: |
          sudo qemu-nbd --disconnect /dev/nbd0
          sudo udevadm settle

      - name: UEFI boot pending Slot B and prove Desktop usability
        shell: bash
        run: |
          codefd=/usr/share/OVMF/OVMF_CODE_4M.fd
          varsfd=/usr/share/OVMF/OVMF_VARS_4M.fd
          test -f "$codefd" && test -f "$varsfd"
          cp "$varsfd" ci/OVMF_VARS.fd
          set +e
          timeout 300 qemu-system-x86_64 \
            -machine q35 -m 4096 -smp 4 -vga virtio \
            -drive if=pflash,format=raw,readonly=on,file="$codefd" \
            -drive if=pflash,format=raw,file=ci/OVMF_VARS.fd \
            -drive file=ci/desktop-ab.raw,format=raw,if=virtio \
            -display none -serial stdio -no-reboot -snapshot \
            > ci/qemu-desktop-ab.log 2>&1
          code=$?
          set -e
          cat ci/qemu-desktop-ab.log
          if [[ $code -ne 0 && $code -ne 124 ]]; then exit "$code"; fi
          grep -Fq 'KINGAI_DESKTOP_AB_VERSION_OK' ci/qemu-desktop-ab.log
          grep -Fq 'KINGAI_DESKTOP_AB_USER_OK' ci/qemu-desktop-ab.log
          grep -Fq 'KINGAI_DESKTOP_AB_HOME_OK' ci/qemu-desktop-ab.log
          grep -Fq 'KINGAI_DESKTOP_AB_WIFI_OK' ci/qemu-desktop-ab.log
          grep -Fq 'KINGAI_DESKTOP_AB_SDDM_OK' ci/qemu-desktop-ab.log
          if grep -Fq 'grub>' ci/qemu-desktop-ab.log; then
            echo 'Pending Desktop update dropped to GRUB prompt.' >&2
            exit 1
          fi

      - name: Cleanup
        if: always()
        run: |
          mount | awk '$3 ~ /ci\/(active|target|state)$/ {print $3}' | sort -r | xargs -r sudo umount || true
          sudo cryptsetup close kingai-ab-state-check 2>/dev/null || true
          sudo qemu-nbd --disconnect /dev/nbd0 2>/dev/null || true
