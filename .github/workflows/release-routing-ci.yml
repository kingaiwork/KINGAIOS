name: KINGAI OS Release Routing CI

on:
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/release-routing-ci.yml'
      - 'scripts/resolve-release-params.sh'
      - 'scripts/test-resolve-release-params.sh'
      - '.release/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/release-routing-ci.yml'
      - 'scripts/resolve-release-params.sh'
      - 'scripts/test-resolve-release-params.sh'

permissions:
  contents: read

jobs:
  routing:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Validate resolver shell
        run: bash -n scripts/resolve-release-params.sh scripts/test-resolve-release-params.sh
      - name: Run release-routing regression suite
        run: bash scripts/test-resolve-release-params.sh
      - name: Prove merge-commit diff routing
        shell: bash
        run: |
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          git init -q "$tmp/repo"
          cd "$tmp/repo"
          git config user.name 'KINGAI CI'
          git config user.email 'ci@kingai.invalid'
          mkdir -p .release
          printf '{"profile":"server"}\n' > .release/server-dev.json
          printf '{"profile":"desktop"}\n' > .release/desktop-dev.json
          git add . && git commit -qm base
          git branch desktop
          git switch -q desktop
          printf '{"profile":"desktop","attempt":2}\n' > .release/desktop-dev.json
          git add .release/desktop-dev.json && git commit -qm desktop-request
          git switch -q master
          before=$(git rev-parse HEAD)
          git merge --no-ff -qm 'merge desktop release' desktop
          sha=$(git rev-parse HEAD)
          cp "$GITHUB_WORKSPACE/scripts/resolve-release-params.sh" ./resolve.sh
          out=$(bash ./resolve.sh push '' '' "$before" "$sha")
          grep -qx 'profile=desktop' <<<"$out"
          grep -qx 'channel=dev' <<<"$out"
