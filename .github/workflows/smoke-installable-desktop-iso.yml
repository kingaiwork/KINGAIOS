name: KINGAI OS Installable Desktop ISO Smoke

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'cmd/kingai-installer/**'
      - 'internal/installer/**'
      - 'scripts/kingai-install-live.sh'
      - 'scripts/build-rootfs.sh'
      - 'scripts/build-live-iso.sh'
      - 'distro/packages/desktop.txt'
      - 'distro/packages/installer-common.txt'
      - 'distro/packages/installer-amd64.txt'
      - 'distro/overlay/**'
      - 'systemd/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/smoke-installable-desktop-iso.yml'
  workflow_dispatch:

concurrency:
  group: kingai-installable-desktop-iso-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desktop-live-iso-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Install ISO installer and VM tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            mmdebstrap ubuntu-keyring zstd squashfs-tools xorriso \
            grub-pc-bin grub-efi-amd64-bin grub-common grub2-common mtools \
            gdisk parted dosfstools e2fsprogs cryptsetup-bin rsync \
            qemu-utils qemu-system-x86 ovmf jq

      - name: Validate installer shell surfaces
        run: |
          bash -n scripts/kingai-install-live.sh
          bash -n distro/overlay/usr/lib/kingai/kingai-configure-desktop-install
          bash -n distro/overlay/usr/lib/kingai/kingai-installer-gui

      - name: Build Desktop root filesystem
        run: sudo --preserve-env=PATH,KINGAI_SKIP_ARCHIVE KINGAI_SKIP_ARCHIVE=1 bash scripts/build-rootfs.sh desktop amd64 dist

      - name: Validate Desktop installer and hardware surface
        run: |
          root=dist/rootfs-desktop-amd64
          sudo test -x "$root/usr/sbin/kingai-install"
          sudo test -r "$root/usr/lib/kingai/kingai-configure-desktop-install"
          sudo test -r "$root/usr/lib/kingai/kingai-installer-gui"
          sudo test -f "$root/usr/share/applications/kingai-installer.desktop"
          sudo chroot "$root" dpkg-query -W \
            linux-firmware firmware-sof-signed fwupd bluez pipewire wireplumber \
            power-profiles-daemon fprintd systemd-cryptsetup cryptsetup-initramfs \
            kdialog jq falkon kate okular kde-spectacle

      - name: Inject installed Desktop boot proof marker
        shell: bash
        run: |
          root=dist/rootfs-desktop-amd64
          sudo tee "$root/usr/lib/kingai/kingai-desktop-installed-smoke" >/dev/null <<'EOF'
          #!/bin/sh
          set -eu
          mountpoint -q /var/lib/kingai-state
          mountpoint -q /home
          test -e /dev/mapper/KINGAI_STATE
          id kingai >/dev/null
          test "$(id -u kingai):$(id -g kingai)" = 1000:1000
          test "$(stat -c '%u:%g' /home/kingai)" = 1000:1000
          systemctl is-active --quiet sddm.service
          test "$(systemctl get-default)" = graphical.target
          test -x /usr/lib/kingai/kingai-welcome
          test -f /usr/share/plasma/plasmoids/org.kingai.agentcenter/metadata.json
          test ! -e /usr/share/applications/kingai-installer.desktop
          echo KINGAI_DESKTOP_ENCRYPTED_STATE_OK > /dev/ttyS0
          echo KINGAI_DESKTOP_ENCRYPTED_HOME_OK > /dev/ttyS0
          echo KINGAI_DESKTOP_FIRST_USER_OK > /dev/ttyS0
          echo KINGAI_DESKTOP_SDDM_READY > /dev/ttyS0
          echo KINGAI_DESKTOP_INSTALLED_BOOT_OK > /dev/ttyS0
          EOF
          sudo chmod 0755 "$root/usr/lib/kingai/kingai-desktop-installed-smoke"
          sudo tee "$root/usr/lib/systemd/system/kingai-desktop-installed-smoke.service" >/dev/null <<'EOF'
          [Unit]
          Description=KINGAI Desktop installed boot proof
          Requires=sddm.service
          After=local-fs.target kingaid.service sddm.service
          Wants=kingaid.service

          [Service]
          Type=oneshot
          ExecStart=/usr/lib/kingai/kingai-desktop-installed-smoke

          [Install]
          WantedBy=graphical.target
          EOF
          sudo mkdir -p "$root/etc/systemd/system/graphical.target.wants"
          sudo ln -sfn /usr/lib/systemd/system/kingai-desktop-installed-smoke.service \
            "$root/etc/systemd/system/graphical.target.wants/kingai-desktop-installed-smoke.service"

      - name: Build exact installable Desktop ISO payload
        run: sudo --preserve-env=PATH bash scripts/build-live-iso.sh desktop dist

      - name: Mount ISO and embedded squashfs
        shell: bash
        run: |
          set -euo pipefail
          sudo chown -R "$USER:$USER" dist
          iso=$(find dist -maxdepth 1 -name 'KINGAI-OS-Desktop-*.iso' -print -quit)
          test -s "$iso"
          sha256sum -c "$iso.sha256"
          jq -e '.profile == "desktop" and .installable == true and .stage == "installable-preview"' "$iso.manifest.json" >/dev/null
          mkdir -p ci/media ci/source
          sudo mount -o loop,ro "$iso" ci/media
          test -s ci/media/casper/filesystem.squashfs
          sudo mount -t squashfs -o loop,ro ci/media/casper/filesystem.squashfs ci/source
          test -x ci/source/usr/sbin/kingai-install
          test -x ci/source/usr/lib/kingai/kingai-installer
          test -x ci/source/usr/lib/kingai/kingai-welcome
          test -r ci/source/usr/lib/kingai/kingai-configure-desktop-install
          test -r ci/source/usr/lib/kingai/kingai-installer-gui
          grep -q '^NAME="KINGAI OS"' ci/source/usr/lib/os-release

      - name: Create disposable Desktop installation target
        shell: bash
        run: |
          truncate -s 48G ci/desktop-installer-test.raw
          sudo modprobe nbd max_part=16
          sudo qemu-nbd --connect=/dev/nbd0 --format=raw ci/desktop-installer-test.raw
          sudo udevadm settle
          test "$(lsblk -dn -o TYPE /dev/nbd0)" = disk
          head -c 64 /dev/urandom > ci/state.key
          chmod 600 ci/state.key

      - name: Install Desktop through the exact Live ISO entrypoint
        shell: bash
        run: |
          # In a real Live session the configurator is at /usr/lib/kingai. The CI
          # bypass executes the ISO script from a mounted squashfs on the runner,
          # so mirror only this helper at its runtime-absolute path.
          sudo install -d -m0755 /usr/lib/kingai
          sudo install -m0644 ci/source/usr/lib/kingai/kingai-configure-desktop-install /usr/lib/kingai/kingai-configure-desktop-install
          sudo env \
            KINGAI_INSTALLER_LIVE_CI=1 \
            KINGAI_INSTALLER_CI=1 \
            KINGAI_INSTALLER_TEST_PERSIST_KEY=1 \
            KINGAI_INSTALLER_BIN="$PWD/ci/source/usr/lib/kingai/kingai-installer" \
            "$PWD/ci/source/usr/sbin/kingai-install" \
              --target /dev/nbd0 \
              --profile desktop \
              --source-image "$PWD/ci/media/casper/filesystem.squashfs" \
              --state-key "$PWD/ci/state.key" \
              --confirm ERASE:/dev/nbd0 | tee ci/install-result.json
          jq -e '.active_slot == "A" and .target == "/dev/nbd0" and .profile == "desktop"' ci/install-result.json >/dev/null

      - name: Validate installed A-B Desktop disk account and encrypted home
        shell: bash
        run: |
          sudo udevadm settle
          test "$(sudo blkid -s LABEL -o value /dev/nbd0p1)" = KINGAI_EFI
          test "$(sudo blkid -s LABEL -o value /dev/nbd0p2)" = KINGAI_ROOT_A
          test "$(sudo blkid -s LABEL -o value /dev/nbd0p3)" = KINGAI_ROOT_B
          sudo cryptsetup isLuks /dev/nbd0p4
          mkdir -p ci/check-root ci/check-root-b ci/check-efi ci/check-state
          sudo mount /dev/nbd0p2 ci/check-root
          sudo mount /dev/nbd0p3 ci/check-root-b
          sudo mount /dev/nbd0p1 ci/check-efi
          grep -q '^NAME="KINGAI OS"' ci/check-root/usr/lib/os-release
          test -x ci/check-root/usr/lib/kingai/kingai-welcome
          test -f ci/check-root/usr/share/plasma/plasmoids/org.kingai.agentcenter/metadata.json
          test "$(readlink ci/check-root/etc/systemd/system/default.target)" = '/usr/lib/systemd/system/graphical.target'
          grep -Eq '^kingai:x:1000:1000:' ci/check-root/etc/passwd
          grep -Eq '^kingai:x:1000:1000:' ci/check-root-b/etc/passwd
          grep -Fq '/var/lib/kingai-state/home /home none bind,' ci/check-root/etc/fstab
          grep -Fq '/var/lib/kingai-state/home /home none bind,' ci/check-root-b/etc/fstab
          test ! -e ci/check-root/usr/share/applications/kingai-installer.desktop
          test ! -e ci/check-root-b/usr/share/applications/kingai-installer.desktop
          test -f ci/check-root/boot/grub/grub.cfg
          grep -q 'menuentry.*Slot A' ci/check-root/boot/grub/grub.cfg
          grep -q 'menuentry.*Slot B' ci/check-root/boot/grub/grub.cfg
          test -f ci/check-efi/EFI/BOOT/BOOTX64.EFI
          test "$(stat -c '%s' ci/check-efi/EFI/BOOT/BOOTX64.EFI)" -ge 65536
          sudo umount ci/check-efi
          sudo umount ci/check-root-b
          sudo umount ci/check-root

          sudo cryptsetup open --key-file ci/state.key /dev/nbd0p4 kingai-state-check
          sudo mount /dev/mapper/kingai-state-check ci/check-state
          sudo test -d ci/check-state/home/kingai
          test "$(sudo stat -c '%u:%g' ci/check-state/home/kingai)" = 1000:1000
          sudo test -d ci/check-state/home/kingai/Documents
          sudo test -d ci/check-state/home/kingai/Downloads
          sudo umount ci/check-state
          sudo cryptsetup close kingai-state-check

      - name: Unmount live media and disconnect target
        run: |
          sudo umount ci/source
          sudo umount ci/media
          sudo qemu-nbd --disconnect /dev/nbd0
          sudo udevadm settle

      - name: UEFI boot installed Desktop and verify SDDM account and encrypted home
        shell: bash
        run: |
          codefd=/usr/share/OVMF/OVMF_CODE_4M.fd
          varsfd=/usr/share/OVMF/OVMF_VARS_4M.fd
          test -f "$codefd" && test -f "$varsfd"
          cp "$varsfd" ci/OVMF_VARS.fd
          set +e
          timeout 300 qemu-system-x86_64 \
            -machine q35 -m 4096 -smp 4 -vga virtio \
            -drive if=pflash,format=raw,readonly=on,file="$codefd" \
            -drive if=pflash,format=raw,file=ci/OVMF_VARS.fd \
            -drive file=ci/desktop-installer-test.raw,format=raw,if=virtio \
            -display none -serial stdio -no-reboot -snapshot \
            > ci/qemu-installed-desktop.log 2>&1
          code=$?
          set -e
          cat ci/qemu-installed-desktop.log
          if [[ $code -ne 0 && $code -ne 124 ]]; then exit "$code"; fi
          grep -Fq 'KINGAI_DESKTOP_ENCRYPTED_STATE_OK' ci/qemu-installed-desktop.log
          grep -Fq 'KINGAI_DESKTOP_ENCRYPTED_HOME_OK' ci/qemu-installed-desktop.log
          grep -Fq 'KINGAI_DESKTOP_FIRST_USER_OK' ci/qemu-installed-desktop.log
          grep -Fq 'KINGAI_DESKTOP_SDDM_READY' ci/qemu-installed-desktop.log
          grep -Fq 'KINGAI_DESKTOP_INSTALLED_BOOT_OK' ci/qemu-installed-desktop.log
          if grep -Fq 'grub>' ci/qemu-installed-desktop.log; then
            echo 'Installed Desktop dropped to a GRUB prompt.' >&2
            exit 1
          fi

      - name: Cleanup
        if: always()
        run: |
          mount | awk '$3 ~ /ci\/(source|media|check-root|check-root-b|check-efi|check-state)$/ {print $3}' | sort -r | xargs -r sudo umount || true
          sudo cryptsetup close kingai-state-check 2>/dev/null || true
          sudo cryptsetup close KINGAI_STATE 2>/dev/null || true
          sudo qemu-nbd --disconnect /dev/nbd0 2>/dev/null || true
          sudo rm -f /usr/lib/kingai/kingai-configure-desktop-install
