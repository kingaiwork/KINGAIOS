name: KINGAI OS Desktop RootFS Smoke

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'internal/desktop/**'
      - 'configs/**'
      - 'systemd/**'
      - 'sysusers/**'
      - 'distro/packages/desktop.txt'
      - 'distro/overlay/**'
      - 'scripts/build-rootfs.sh'
      - '.github/workflows/smoke-desktop-rootfs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: '1.23.x'
          cache: false
      - name: Install rootfs tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y mmdebstrap ubuntu-keyring zstd
      - name: Build Ubuntu 26.04 based KINGAI Desktop RootFS
        run: sudo --preserve-env=PATH,KINGAI_SKIP_ARCHIVE KINGAI_SKIP_ARCHIVE=1 bash scripts/build-rootfs.sh desktop amd64 dist
      - name: Validate Desktop Core
        run: |
          root=dist/rootfs-desktop-amd64
          sudo chroot "$root" /usr/bin/kingai desktop list
          sudo chroot "$root" dpkg-query -W qdbus-qt6 plasma-desktop plasma-workspace kwin-wayland sddm
          sudo test -x "$root/usr/bin/qdbus6"
          sudo test -x "$root/usr/lib/kingai/kingai-welcome"
          sudo test -f "$root/etc/xdg/autostart/kingai-welcome.desktop"
          sudo test -f "$root/usr/share/kingai/desktop/layouts/kingai-intelligence.js"
          sudo test -f "$root/usr/share/plasma/look-and-feel/org.kingai.intelligence/manifest.json"
          test "$(sudo stat -c '%u:%g' "$root")" = '0:0'
          leaked=$(sudo find "$root/etc/kingai" "$root/usr/lib/kingai" "$root/usr/share/kingai" -uid "$(id -u)" -print -quit)
          test -z "$leaked" || { echo "build-host ownership leaked into KINGAI desktop files: $leaked"; exit 1; }
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('dist/rootfs-desktop-amd64/usr/share/plasma/look-and-feel')
          for name in ('org.kingai.intelligence','org.kingai.flow','org.kingai.classic'):
              p=root/name/'manifest.json'
              data=json.loads(p.read_text())
              assert data['KPackageStructure']=='Plasma/LookAndFeel'
              assert data['X-Plasma-API-Minimum-Version']=='6.0'
          PY
