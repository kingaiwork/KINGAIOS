name: KINGAI OS Desktop RootFS Smoke

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'internal/desktop/**'
      - 'internal/statuspub/**'
      - 'cmd/kingaid/**'
      - 'configs/**'
      - 'systemd/**'
      - 'sysusers/**'
      - 'distro/packages/desktop.txt'
      - 'distro/overlay/**'
      - 'scripts/build-rootfs.sh'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/smoke-desktop-rootfs.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - 'internal/desktop/**'
      - 'internal/statuspub/**'
      - 'cmd/kingaid/**'
      - 'configs/**'
      - 'systemd/**'
      - 'sysusers/**'
      - 'distro/packages/desktop.txt'
      - 'distro/overlay/**'
      - 'scripts/build-rootfs.sh'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/smoke-desktop-rootfs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Install rootfs tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y mmdebstrap ubuntu-keyring zstd
      - name: Build Ubuntu 26.04 based KINGAI Desktop RootFS
        run: sudo --preserve-env=PATH,KINGAI_SKIP_ARCHIVE KINGAI_SKIP_ARCHIVE=1 bash scripts/build-rootfs.sh desktop amd64 dist
      - name: Validate Desktop Core KINGAI Center and Intelligence shell
        run: |
          set -euo pipefail
          root=dist/rootfs-desktop-amd64
          sudo chroot "$root" /usr/bin/kingai desktop list
          sudo chroot "$root" dpkg-query -W qdbus-qt6 qml-qt6 qml6-module-qml qml6-module-qtquick-controls qml6-module-qtquick-layouts plasma-desktop plasma-workspace kwin-wayland sddm
          sudo test -x "$root/usr/bin/qdbus6"
          sudo chroot "$root" sh -c 'command -v qml6 >/dev/null || test -x /usr/lib/qt6/bin/qml || command -v qml >/dev/null'
          sudo test -x "$root/usr/lib/kingai/kingai-welcome"
          sudo test -f "$root/etc/xdg/autostart/kingai-welcome.desktop"
          sudo test -f "$root/usr/share/kingai/desktop/layouts/kingai-intelligence.js"
          sudo test -f "$root/usr/share/kingai/desktop/intelligence/Main.qml"
          sudo test -f "$root/usr/share/kingai/desktop/intelligence/launch.sh"
          sudo test -f "$root/usr/share/kingai/desktop/experiences/intelligence.json"
          sudo test -f "$root/usr/share/applications/kingai-intelligence.desktop"
          sudo test -f "$root/etc/xdg/mimeapps.list"
          sudo grep -q '^MimeType=x-scheme-handler/kingai;' "$root/usr/share/applications/kingai-intelligence.desktop"
          sudo grep -q '^x-scheme-handler/kingai=kingai-intelligence.desktop$' "$root/etc/xdg/mimeapps.list"
          sudo grep -q 'Application.arguments' "$root/usr/share/kingai/desktop/intelligence/Main.qml"
          sudo grep -q 'public-status.json' "$root/usr/share/kingai/desktop/intelligence/Main.qml"
          sudo grep -q 'Main.qml -- --center' "$root/usr/share/kingai/desktop/intelligence/launch.sh"
          sudo test -f "$root/usr/share/plasma/look-and-feel/org.kingai.intelligence/manifest.json"
          sudo test -f "$root/usr/share/plasma/plasmoids/org.kingai.agentcenter/manifest.json"
          sudo test -f "$root/usr/share/plasma/plasmoids/org.kingai.agentcenter/contents/ui/main.qml"
          sudo test -f "$root/usr/lib/systemd/system/kingai-health-scan.service"
          sudo test -f "$root/usr/lib/systemd/system/kingai-health-scan.timer"
          test "$(sudo stat -c '%u:%g' "$root")" = '0:0'
          leaked=$(sudo find "$root/etc/kingai" "$root/usr/lib/kingai" "$root/usr/share/kingai" -uid "$(id -u)" -print -quit)
          test -z "$leaked" || { echo "build-host ownership leaked into KINGAI desktop files: $leaked"; exit 1; }
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('dist/rootfs-desktop-amd64/usr/share/plasma/look-and-feel')
          for name in ('org.kingai.intelligence','org.kingai.flow','org.kingai.classic'):
              data=json.loads((root/name/'manifest.json').read_text())
              assert data['KPackageStructure']=='Plasma/LookAndFeel'
              assert data['X-Plasma-API-Minimum-Version']=='6.0'
          p=Path('dist/rootfs-desktop-amd64/usr/share/plasma/plasmoids/org.kingai.agentcenter/manifest.json')
          data=json.loads(p.read_text())
          assert data['KPackageStructure']=='Plasma/Applet'
          assert data['X-Plasma-API-Minimum-Version']=='6.0'
          assert data['KPlugin']['Name']=='KINGAI Center'
          qml=Path('dist/rootfs-desktop-amd64/usr/share/plasma/plasmoids/org.kingai.agentcenter/contents/ui/main.qml').read_text()
          for token in ('KINGAI Center','activeTasks','pendingApprovals','modelProviders','public-status.json','kingai://approvals','kingai://tasks'):
              assert token in qml, token
          shell=Path('dist/rootfs-desktop-amd64/usr/share/kingai/desktop/intelligence/Main.qml').read_text()
          for center in ('home','agents','tasks','approvals','memory','models','automations','health'):
              assert f'id: "{center}"' in shell, center
          assert 'Application.arguments' in shell
          assert 'file:///run/kingai/public-status.json' in shell
          # Explanatory privacy labels are allowed. Test against concrete sample
          # secrets/private payloads used by the statuspub regression suite.
          for forbidden in ('must never be published','private task text','approval-target-secret','sk-test-secret','api_key='):
              assert forbidden not in qml.lower(), forbidden
              assert forbidden not in shell.lower(), forbidden
          PY
