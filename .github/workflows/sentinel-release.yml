name: KINGAI OS Sentinel Build-Test-Publish

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.release/sentinel-dev.json'

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  R2_BUCKET: ${{ secrets.R2_BUCKET }}
  KINGAI_WRANGLER_VERSION: '4.94.0'

concurrency:
  group: kingai-sentinel-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Validate Sentinel source
        run: |
          go mod verify
          go test ./...
          go vet ./...
          go build -trimpath -o /tmp/kingai-sentinel ./cmd/kingai-sentinel
          bash -n scripts/*.sh
          python3 -m json.tool configs/sentinel.json >/dev/null
          python3 -m json.tool configs/sentinel-scope.example.json >/dev/null
          python3 -m json.tool sentinel/feeds/feeds.json >/dev/null
          python3 -m json.tool sentinel/packs/catalog.json >/dev/null

      - name: Install image and VM tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y mmdebstrap ubuntu-keyring zstd squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin grub-common mtools qemu-system-x86 ovmf jq

      - name: Build Sentinel root filesystem
        run: sudo --preserve-env=PATH bash scripts/build-sentinel-rootfs.sh amd64 dist

      - name: Build Sentinel installable Live ISO
        env:
          KINGAI_RELEASE_CHANNEL: dev
        run: sudo --preserve-env=PATH,KINGAI_RELEASE_CHANNEL bash scripts/build-live-iso.sh sentinel dist

      - name: Normalize artifact ownership
        run: sudo chown -R "$USER:$USER" dist

      - name: Validate Sentinel artifacts
        id: artifact
        shell: bash
        run: |
          iso=$(find dist -maxdepth 1 -name 'KINGAI-OS-Sentinel-*-amd64.iso' -print -quit)
          rootfs=$(find dist -maxdepth 1 -name 'KINGAI-OS-sentinel-amd64-rootfs.tar.zst' -print -quit)
          test -s "$iso"
          test -s "$rootfs"
          sha256sum -c "$iso.sha256"
          sha256sum -c "$rootfs.sha256"
          test -s "$iso.manifest.json"
          test -s "$iso.spdx.json"
          test -s "$rootfs.spdx.json"
          jq -e '.product == "KINGAI OS" and .profile == "sentinel" and .release_channel == "dev" and .installable == true and .stage == "installable-preview" and .sbom.format == "SPDX-2.3"' "$iso.manifest.json" >/dev/null
          jq -e '.spdxVersion == "SPDX-2.3" and .SPDXID == "SPDXRef-DOCUMENT"' "$iso.spdx.json" >/dev/null
          jq -e '.spdxVersion == "SPDX-2.3" and .SPDXID == "SPDXRef-DOCUMENT"' "$rootfs.spdx.json" >/dev/null
          echo "iso=$iso" >> "$GITHUB_OUTPUT"
          echo "rootfs=$rootfs" >> "$GITHUB_OUTPUT"

      - name: QEMU BIOS boot verification
        shell: bash
        run: |
          iso='${{ steps.artifact.outputs.iso }}'
          set +e
          timeout 150 qemu-system-x86_64 -m 2048 -smp 2 -cdrom "$iso" -boot d -display none -serial stdio -no-reboot -snapshot > qemu-sentinel-bios.log 2>&1
          code=$?
          set -e
          cat qemu-sentinel-bios.log
          if [[ $code -ne 0 && $code -ne 124 ]]; then exit "$code"; fi
          grep -Eiq 'Linux version|casper|KINGAI|systemd' qemu-sentinel-bios.log

      - name: QEMU UEFI boot verification
        shell: bash
        run: |
          iso='${{ steps.artifact.outputs.iso }}'
          code_file=/usr/share/OVMF/OVMF_CODE_4M.fd
          vars_file=/usr/share/OVMF/OVMF_VARS_4M.fd
          if [[ ! -f "$code_file" || ! -f "$vars_file" ]]; then
            code_file=/usr/share/OVMF/OVMF_CODE.fd
            vars_file=/usr/share/OVMF/OVMF_VARS.fd
          fi
          test -f "$code_file"
          test -f "$vars_file"
          cp "$vars_file" ovmf-sentinel-vars.fd
          set +e
          timeout 150 qemu-system-x86_64 -machine q35 -m 2048 -smp 2 \
            -drive if=pflash,format=raw,readonly=on,file="$code_file" \
            -drive if=pflash,format=raw,file=ovmf-sentinel-vars.fd \
            -cdrom "$iso" -boot d -display none -serial stdio -no-reboot -snapshot > qemu-sentinel-uefi.log 2>&1
          code=$?
          set -e
          cat qemu-sentinel-uefi.log
          if [[ $code -ne 0 && $code -ne 124 ]]; then exit "$code"; fi
          grep -Eiq 'Linux version|casper|KINGAI|systemd' qemu-sentinel-uefi.log

      - name: Prepare Sentinel Developer Preview release
        id: release
        shell: bash
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          base_version=$(bash scripts/release-base-version.sh "$version")
          tag="v${base_version}-sentinel-dev.${GITHUB_RUN_NUMBER}"
          title="KINGAI OS ${base_version} Sentinel Developer Preview"
          cat > release-notes.md <<EOF
          # KINGAI OS ${base_version} — Sentinel Developer Preview

          - Edition: Sentinel / Proactive Defense Intelligence
          - Architecture: amd64
          - Channel: dev
          - Source commit: ${GITHUB_SHA}
          - Installable Live ISO: included
          - Cloud/server RootFS archive: included
          - BIOS and UEFI boot: verified in this workflow
          - Management console: localhost-only by default
          - Authorized validation: default-deny for unknown targets
          - SPDX 2.3 SBOM and SHA-256 checksums: included

          This is a Developer Preview. Beta/RC/Stable Sentinel publication remains gated until dedicated release evidence is added.
          EOF
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"

      - name: Create Sentinel GitHub prerelease
        shell: bash
        run: |
          gh release create '${{ steps.release.outputs.tag }}' \
            --target "$GITHUB_SHA" \
            --title '${{ steps.release.outputs.title }}' \
            --notes-file release-notes.md \
            --prerelease

      - name: Publish Sentinel ISO
        env:
          GH_RELEASE_TAG: ${{ steps.release.outputs.tag }}
          R2_PREFIX: dev/sentinel
        run: bash scripts/publish-artifact.sh '${{ steps.artifact.outputs.iso }}'

      - name: Publish Sentinel root filesystem
        env:
          GH_RELEASE_TAG: ${{ steps.release.outputs.tag }}
          R2_PREFIX: dev/sentinel
        run: bash scripts/publish-artifact.sh '${{ steps.artifact.outputs.rootfs }}'

      - name: Upload workflow evidence
        uses: actions/upload-artifact@v4
        with:
          name: kingai-sentinel-release-evidence
          path: |
            release-notes.md
            qemu-sentinel-bios.log
            qemu-sentinel-uefi.log
            dist/*.sha256
            dist/*.manifest.json
            dist/*.spdx.json
          retention-days: 14
