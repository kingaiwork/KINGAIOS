name: KINGAI OS Desktop UI Capture

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'internal/desktop/**'
      - 'distro/packages/desktop.txt'
      - 'distro/overlay/**'
      - 'scripts/build-rootfs.sh'
      - 'scripts/build-live-iso.sh'
      - 'scripts/capture-desktop-frame.sh'
      - '.github/workflows/capture-desktop-ui.yml'

permissions:
  contents: read

concurrency:
  group: kingai-desktop-ui-capture
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Install image, VM and capture tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y mmdebstrap ubuntu-keyring zstd squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin grub-common mtools qemu-system-x86 ovmf socat imagemagick

      - name: Build Desktop root filesystem
        run: sudo --preserve-env=PATH,KINGAI_SKIP_ARCHIVE KINGAI_SKIP_ARCHIVE=1 bash scripts/build-rootfs.sh desktop amd64 dist

      - name: Configure isolated screenshot mode
        shell: bash
        run: |
          set -euo pipefail
          root=dist/rootfs-desktop-amd64
          capture_experience=kingai-flow
          session_file="$({
            find "$root/usr/share/wayland-sessions" -maxdepth 1 -name '*.desktop' -print 2>/dev/null || true
            find "$root/usr/share/xsessions" -maxdepth 1 -name '*.desktop' -print 2>/dev/null || true
          } | head -n 1)"
          if [ -z "$session_file" ]; then
            echo 'No Plasma/desktop session file found in the built Desktop rootfs.' >&2
            find "$root/usr/share" -maxdepth 3 -type f \( -path '*/wayland-sessions/*.desktop' -o -path '*/xsessions/*.desktop' \) -print 2>/dev/null || true
            dpkg_list="$root/usr/share/kingai/legal/packages.tsv"
            [ -f "$dpkg_list" ] && grep -E 'plasma|kwin|sddm' "$dpkg_list" || true
            exit 1
          fi
          session=$(basename "$session_file" .desktop)
          echo "Using real desktop session: $session_file"
          echo "Applying screenshot experience: $capture_experience"

          sudo mkdir -p "$root/etc/sddm.conf.d"
          sudo tee "$root/etc/sddm.conf.d/90-kingai-screenshot.conf" >/dev/null <<EOF
          [Autologin]
          User=kingai
          Session=$session
          Relogin=false
          EOF

          # Casper creates the live desktop account from /etc/skel. Seed a real
          # KINGAI experience so the first-run Welcome window exits immediately
          # and the capture validates the applied Plasma shell, not only Welcome.
          sudo mkdir -p "$root/etc/skel/.config"
          sudo tee "$root/etc/skel/.config/kingai-desktop.ini" >/dev/null <<EOF
          [General]
          experience=$capture_experience
          EOF

          # Apply the selected profile from inside the graphical session. Keep
          # apply retries and visual-state settling as separate bounded phases so
          # a missing panel/wallpaper can fail quickly with useful diagnostics.
          sudo tee "$root/usr/local/bin/kingai-capture-apply-profile" >/dev/null <<'EOF'
          #!/bin/sh
          set -eu
          marker="$HOME/.cache/kingai-capture-profile-applied"
          failed="$HOME/.cache/kingai-capture-profile-failed"
          log="$HOME/.cache/kingai-capture-profile.log"
          plasma_cfg="$HOME/.config/plasma-org.kde.plasma.desktop-appletsrc"
          mkdir -p "$HOME/.cache"
          rm -f "$marker" "$failed"
          : > "$log"

          echo "KINGAI capture user=$(id -un) home=$HOME session=${XDG_SESSION_TYPE:-unknown} desktop=${XDG_CURRENT_DESKTOP:-unknown}" >>"$log"
          if command -v kpackagetool6 >/dev/null 2>&1; then
            echo '=== Plasma/Applet registry ===' >>"$log"
            kpackagetool6 --type Plasma/Applet --list >>"$log" 2>&1 || true
          fi

          apply_ok=0
          for n in $(seq 1 45); do
            echo "=== kingai desktop apply attempt $n ===" >>"$log"
            if /usr/bin/kingai desktop apply >>"$log" 2>&1; then
              apply_ok=1
              break
            fi
            sleep 1
          done
          if [ "$apply_ok" -ne 1 ]; then
            echo 'KINGAI desktop apply never succeeded.' >>"$log"
            touch "$failed"
            cat "$log" >/dev/ttyS0 2>/dev/null || true
            exit 1
          fi

          # Probe the live Plasma object model as well as the persisted KConfig.
          # Runtime state is the stronger screenshot condition; file persistence
          # remains useful evidence and catches regressions across shell restarts.
          probe_js='(function(){var a=false,w=false;var ps=panels();for(var i=0;i<ps.length;i++){var ids=ps[i].widgetIds;for(var j=0;j<ids.length;j++){var x=ps[i].widgetById(ids[j]);if(x&&x.type==="org.kingai.agentcenter")a=true;}}var ds=desktops();for(var k=0;k<ds.length;k++){ds[k].currentConfigGroup=["Wallpaper","org.kde.image","General"];var img=String(ds[k].readConfig("Image",""));if(img.indexOf("kingai-flow.svg")>=0)w=true;}return "KINGAI_RUNTIME_STATE agent="+a+" wallpaper="+w;})()'
          for settle in $(seq 1 75); do
            runtime_state=""
            for qdbus in qdbus6 /usr/lib/qt6/bin/qdbus qdbus; do
              if command -v "$qdbus" >/dev/null 2>&1 || [ -x "$qdbus" ]; then
                runtime_state=$("$qdbus" org.kde.plasmashell /PlasmaShell org.kde.PlasmaShell.evaluateScript "$probe_js" 2>&1 || true)
                [ -n "$runtime_state" ] && break
              fi
            done
            config_agent=0
            config_wallpaper=0
            if [ -f "$plasma_cfg" ]; then
              grep -Fq 'org.kingai.agentcenter' "$plasma_cfg" && config_agent=1 || true
              grep -Fq 'kingai-flow.svg' "$plasma_cfg" && config_wallpaper=1 || true
            fi
            if printf '%s' "$runtime_state" | grep -Fq 'agent=true wallpaper=true'; then
              echo "Runtime visual state ready on settle $settle: $runtime_state" >>"$log"
              touch "$marker"
              exit 0
            fi
            if [ "$config_agent" -eq 1 ] && [ "$config_wallpaper" -eq 1 ]; then
              echo "Persisted visual state ready on settle $settle: $runtime_state" >>"$log"
              touch "$marker"
              exit 0
            fi
            if [ "$settle" -eq 1 ] || [ $((settle % 15)) -eq 0 ]; then
              echo "settle=$settle runtime=[$runtime_state] config_agent=$config_agent config_wallpaper=$config_wallpaper" >>"$log"
            fi
            sleep 1
          done

          echo 'KINGAI desktop apply succeeded but the expected Flow runtime/persisted visual state did not become ready.' >>"$log"
          echo '=== plasma appletsrc ===' >>"$log"
          if [ -f "$plasma_cfg" ]; then
            cat "$plasma_cfg" >>"$log" 2>&1 || true
          else
            echo "missing: $plasma_cfg" >>"$log"
          fi
          touch "$failed"
          cat "$log" >/dev/ttyS0 2>/dev/null || true
          exit 1
          EOF
          sudo chmod 0755 "$root/usr/local/bin/kingai-capture-apply-profile"
          sudo mkdir -p "$root/etc/xdg/autostart"
          sudo tee "$root/etc/xdg/autostart/kingai-capture-apply-profile.desktop" >/dev/null <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=KINGAI Desktop Capture Profile
          Exec=/usr/local/bin/kingai-capture-apply-profile
          OnlyShowIn=KDE;
          X-KDE-StartupNotify=false
          NoDisplay=true
          EOF

          # A graphical.target marker is too early: sddm can be active while the
          # framebuffer is blank. Require a real Plasma shell plus the bounded
          # user-session visual probe; surface a failed probe immediately.
          sudo tee "$root/usr/lib/systemd/system/kingai-desktop-capture-ready.service" >/dev/null <<'EOF'
          [Unit]
          Description=KINGAI Desktop applied-session capture readiness
          Requires=sddm.service
          After=sddm.service

          [Service]
          Type=oneshot
          ExecStart=/bin/sh -c 'for n in $(seq 1 240); do plasma=0; for f in /proc/[0-9]*/comm; do [ -r "$f" ] && [ "$(cat "$f" 2>/dev/null)" = plasmashell ] && plasma=1 && break; done; if [ -f /home/kingai/.cache/kingai-capture-profile-failed ]; then echo KINGAI_DESKTOP_SESSION_NOT_READY > /dev/ttyS0; cat /home/kingai/.cache/kingai-capture-profile.log > /dev/ttyS0 2>/dev/null || true; exit 1; fi; if [ "$plasma" = 1 ] && [ -f /home/kingai/.cache/kingai-capture-profile-applied ]; then sleep 8; echo KINGAI_DESKTOP_SESSION_READY > /dev/ttyS0; exit 0; fi; sleep 1; done; echo KINGAI_DESKTOP_SESSION_NOT_READY > /dev/ttyS0; [ -f /home/kingai/.cache/kingai-capture-profile.log ] && cat /home/kingai/.cache/kingai-capture-profile.log > /dev/ttyS0 || true; exit 1'

          [Install]
          WantedBy=graphical.target
          EOF
          sudo mkdir -p "$root/etc/systemd/system/graphical.target.wants"
          sudo ln -sfn /usr/lib/systemd/system/kingai-desktop-capture-ready.service "$root/etc/systemd/system/graphical.target.wants/kingai-desktop-capture-ready.service"

          # Screenshot mode is test-only. It carries no credentials, API keys,
          # personal names, private addresses or production data.
          printf 'KINGAI screenshot mode\n' | sudo tee "$root/etc/kingai/screenshot-mode" >/dev/null

      - name: Build Desktop Live ISO
        run: sudo --preserve-env=PATH bash scripts/build-live-iso.sh desktop dist

      - name: Capture and validate real Desktop framebuffer
        run: |
          iso=$(find dist -maxdepth 1 -name 'KINGAI-OS-Desktop-*.iso' -print -quit)
          test -n "$iso"
          chmod +x scripts/capture-desktop-frame.sh
          bash scripts/capture-desktop-frame.sh "$iso" kingai-desktop-real.png

      - name: Upload capture diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kingai-desktop-capture-diagnostics
          path: |
            kingai-desktop-real.log
            kingai-desktop-real.png
          if-no-files-found: warn
          retention-days: 14

      - name: Create capture metadata
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          version = open('VERSION', encoding='utf-8').read().strip()
          data = {
              'product': 'KINGAI OS Desktop',
              'source_version': version,
              'edition': 'Desktop',
              'stage': 'D5 Alpha / Pre-Alpha',
              'capture_type': 'Actual KINGAI OS',
              'environment': 'QEMU Live VM',
              'experience_id': 'kingai-flow',
              'experience': 'KINGAI Flow',
              'validation': 'Plasma shell running with KINGAI Center and KINGAI Flow wallpaper verified in live runtime or persisted Plasma configuration before framebuffer capture',
              'commit': os.environ['GITHUB_SHA'],
              'captured_at': datetime.now(timezone.utc).isoformat(),
              'privacy': 'isolated screenshot mode; no production secrets',
          }
          open('kingai-desktop-real.json', 'w', encoding='utf-8').write(json.dumps(data, indent=2) + '\n')
          PY

      - name: Upload capture artifact
        uses: actions/upload-artifact@v4
        with:
          name: kingai-desktop-real-capture
          path: |
            kingai-desktop-real.png
            kingai-desktop-real.json
            kingai-desktop-real.log
          if-no-files-found: error
          retention-days: 30

      - name: Publish capture to static website when token is configured
        env:
          SYNC_TOKEN: ${{ secrets.KINGAI_WEB_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$SYNC_TOKEN" ]; then
            echo 'KINGAI_WEB_SYNC_TOKEN is not configured; keeping screenshot as workflow artifact only.'
            exit 0
          fi
          GH_TOKEN="$SYNC_TOKEN" gh repo clone kingaiwork/Kingaiosweb web -- --depth=1
          mkdir -p web/public/assets/captures
          cp kingai-desktop-real.png web/public/assets/captures/desktop-latest.png
          cp kingai-desktop-real.json web/public/assets/captures/desktop-latest.json
          cd web
          git config user.name 'kingai-capture[bot]'
          git config user.email '66586837+kingaiwork@users.noreply.github.com'
          git add -- public/assets/captures/desktop-latest.png public/assets/captures/desktop-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m '[capture-os] refresh verified real desktop screenshot'
          GH_TOKEN="$SYNC_TOKEN" gh auth setup-git
          git push origin HEAD:main
