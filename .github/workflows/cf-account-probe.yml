name: Cloudflare Account Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cf-account-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: cc658c266bef011a07f83c73379d47e9
    steps:
      - uses: actions/checkout@v4
      - name: Probe without exposing secret
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            printf '%s\n' '{"token_present":false,"api_read_ok":false}' > ops/cf-account-probe.json
          else
            python3 - <<'PY'
          import json, os, urllib.request
          token=os.environ['CLOUDFLARE_API_TOKEN']; account=os.environ['CLOUDFLARE_ACCOUNT_ID']
          out={'token_present':True,'api_read_ok':False}
          try:
              req=urllib.request.Request(f'https://api.cloudflare.com/client/v4/accounts/{account}/pages/projects?per_page=1',headers={'Authorization':f'Bearer {token}','User-Agent':'KINGAI-Probe/1.0'})
              with urllib.request.urlopen(req,timeout=30) as r: data=json.load(r)
              out['api_read_ok']=data.get('success') is True
          except Exception:
              pass
          open('ops/cf-account-probe.json','w').write(json.dumps(out,separators=(',',':'))+'\n')
          PY
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- ops/cf-account-probe.json
          if ! git diff --cached --quiet; then
            git commit -m 'ops: record Cloudflare access probe [skip ci]'
            git push origin HEAD:main
          fi
