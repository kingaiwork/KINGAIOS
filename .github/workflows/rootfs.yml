name: KINGAI OS RootFS Build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Distribution profile
        type: choice
        required: true
        default: server
        options: [server, desktop, iot]
      arch:
        description: CPU architecture
        type: choice
        required: true
        default: amd64
        options: [amd64, arm64]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Install image tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y mmdebstrap ubuntu-keyring zstd qemu-user-static
      - name: Build root filesystem
        run: sudo --preserve-env=PATH bash scripts/build-rootfs.sh "${{ inputs.profile }}" "${{ inputs.arch }}" dist
      - name: Ownership normalization
        run: sudo chown -R "$USER:$USER" dist
      - name: Verify artifact checksum and SBOM
        shell: bash
        run: |
          artifact=$(find dist -maxdepth 1 -name '*.tar.zst' -print -quit)
          test -s "$artifact"
          sha256sum -c "$artifact.sha256"
          test -s "$artifact.spdx.json"
          python3 - "$artifact.spdx.json" <<'PY'
          import json, sys
          p=json.load(open(sys.argv[1]))
          assert p['spdxVersion']=='SPDX-2.3'
          assert p['SPDXID']=='SPDXRef-DOCUMENT'
          PY
      - name: Upload developer artifact
        uses: actions/upload-artifact@v7
        with:
          name: kingai-${{ inputs.profile }}-${{ inputs.arch }}-rootfs
          path: |
            dist/*.tar.zst
            dist/*.sha256
            dist/*.spdx.json
          retention-days: 7
