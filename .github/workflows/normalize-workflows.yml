name: KINGAI Workflow Runtime Normalization

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/normalize-workflows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Normalize GitHub Actions and Go toolchain source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for p in sorted(Path('.github/workflows').glob('*.yml')):
              s = p.read_text()
              n = (s.replace('actions/checkout@v4', 'actions/checkout@v6')
                    .replace('actions/checkout@v5', 'actions/checkout@v6')
                    .replace('actions/setup-go@v5', 'actions/setup-go@v7')
                    .replace("go-version: '1.23.x'", 'go-version-file: go.mod')
                    .replace('go-version: "1.23.x"', 'go-version-file: go.mod'))
              if n != s:
                  p.write_text(n)
                  print('normalized', p)
          PY
          if grep -R -nE 'actions/(checkout@v[45]|setup-go@v5)|go-version: .1\.23' .github/workflows; then
            echo 'legacy workflow runtime remains' >&2
            exit 1
          fi
      - name: Commit normalized workflows
        run: |
          if git diff --quiet -- .github/workflows; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows
          git commit -m 'normalize CI on Go toolchain from go.mod'
          git push origin HEAD:main
