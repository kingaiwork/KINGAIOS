name: KINGAI OS Container

on:
  pull_request:
    paths:
      - .github/workflows/container.yml
      - .github/workflows/container-release.yml
      - .dockerignore
      - container/**
      - profiles/container.yaml
      - scripts/build-container.sh
      - scripts/test-container.sh
      - scripts/validate-oci-archive.py
      - cmd/kingai/**
      - cmd/kingaid/**
      - internal/**
      - configs/**
      - go.mod
      - go.sum
  push:
    branches:
      - main
    paths:
      - .github/workflows/container.yml
      - .github/workflows/container-release.yml
      - .dockerignore
      - container/**
      - profiles/container.yaml
      - scripts/build-container.sh
      - scripts/test-container.sh
      - scripts/validate-oci-archive.py
      - cmd/kingai/**
      - cmd/kingaid/**
      - internal/**
      - configs/**
      - go.mod
      - go.sum
  workflow_dispatch:
    inputs:
      publish:
        description: Publish developer image to GHCR
        required: true
        default: false
        type: boolean
      tag:
        description: Container tag when publishing
        required: false
        default: dev
        type: string

permissions:
  contents: read
  packages: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build and smoke test hardened amd64 container
        run: bash scripts/test-container.sh

  security:
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build scan image
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          docker build \
            --file container/Dockerfile \
            --build-arg "VERSION=$version" \
            --build-arg "REVISION=$GITHUB_SHA" \
            --tag kingai-os:scan \
            .
      - name: Block fixable critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: kingai-os:scan
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL

  multiarch:
    needs: [smoke, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and validate amd64/arm64 OCI archive
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.publish }}
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          docker buildx build \
            --file container/Dockerfile \
            --platform linux/amd64,linux/arm64 \
            --build-arg "VERSION=$version" \
            --build-arg "REVISION=$GITHUB_SHA" \
            --provenance=false \
            --output type=oci,dest=/tmp/kingai-os.oci.tar \
            .
          python3 scripts/validate-oci-archive.py /tmp/kingai-os.oci.tar \
            --platform linux/amd64 \
            --platform linux/arm64
      - name: Login to GHCR
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Publish developer multi-architecture image
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/kingai-os
          TAG: ${{ inputs.tag }}
        run: |
          case "$TAG" in
            stable|latest|rc|release) echo "protected production-like tag is not allowed from this developer workflow" >&2; exit 2 ;;
          esac
          version=$(tr -d '[:space:]' < VERSION)
          docker buildx build \
            --file container/Dockerfile \
            --platform linux/amd64,linux/arm64 \
            --build-arg "VERSION=$version" \
            --build-arg "REVISION=$GITHUB_SHA" \
            --provenance=true \
            --sbom=true \
            --tag "$IMAGE:$TAG" \
            --push \
            .
