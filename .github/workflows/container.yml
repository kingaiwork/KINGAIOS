name: KINGAI OS Container

on:
  pull_request:
    paths:
      - .github/workflows/container.yml
      - .github/workflows/container-release.yml
      - .dockerignore
      - container/**
      - profiles/container.yaml
      - release/gates.json
      - .release/container-beta.json
      - scripts/build-container.sh
      - scripts/test-container.sh
      - scripts/test-container-release-policy.sh
      - scripts/validate-oci-archive.py
      - scripts/verify-container-release.sh
      - cmd/kingai/**
      - cmd/kingaid/**
      - internal/**
      - configs/**
      - go.mod
      - go.sum
  push:
    branches:
      - main
    paths:
      - .github/workflows/container.yml
      - .github/workflows/container-release.yml
      - .dockerignore
      - container/**
      - profiles/container.yaml
      - release/gates.json
      - .release/container-beta.json
      - scripts/build-container.sh
      - scripts/test-container.sh
      - scripts/test-container-release-policy.sh
      - scripts/validate-oci-archive.py
      - scripts/verify-container-release.sh
      - cmd/kingai/**
      - cmd/kingaid/**
      - internal/**
      - configs/**
      - go.mod
      - go.sum
  workflow_dispatch:
    inputs:
      publish:
        description: Publish developer image to GHCR
        required: true
        default: false
        type: boolean
      tag:
        description: Container tag when publishing
        required: false
        default: dev
        type: string

concurrency:
  group: kingai-container-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate release policy
        run: bash scripts/test-container-release-policy.sh
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Run hardened runtime and persistence smoke
        env:
          KINGAI_CONTAINER_TEST_PLATFORM: ${{ matrix.platform }}
        run: bash scripts/test-container.sh

  security:
    needs: smoke
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build architecture-specific scan image
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          docker buildx build \
            --file container/Dockerfile \
            --platform "$PLATFORM" \
            --build-arg "VERSION=$version" \
            --build-arg "REVISION=$GITHUB_SHA" \
            --tag kingai-os:scan \
            --load \
            .
      - name: Block fixable critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: kingai-os:scan
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL

  multiarch:
    needs: [smoke, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and validate amd64/arm64 OCI archive
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.publish }}
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          docker buildx build \
            --file container/Dockerfile \
            --platform linux/amd64,linux/arm64 \
            --build-arg "VERSION=$version" \
            --build-arg "REVISION=$GITHUB_SHA" \
            --provenance=false \
            --output type=oci,dest=/tmp/kingai-os.oci.tar \
            .
          python3 scripts/validate-oci-archive.py /tmp/kingai-os.oci.tar \
            --platform linux/amd64 \
            --platform linux/arm64
      - name: Login to GHCR
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Publish developer multi-architecture image
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/kingai-os
          TAG: ${{ inputs.tag }}
        run: |
          case "$TAG" in
            stable|latest|rc|release) echo "protected production-like tag is not allowed from this developer workflow" >&2; exit 2 ;;
          esac
          version=$(tr -d '[:space:]' < VERSION)
          docker buildx build \
            --file container/Dockerfile \
            --platform linux/amd64,linux/arm64 \
            --build-arg "VERSION=$version" \
            --build-arg "REVISION=$GITHUB_SHA" \
            --provenance=true \
            --sbom=true \
            --tag "$IMAGE:$TAG" \
            --push \
            .
