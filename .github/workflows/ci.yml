name: KINGAI OS Foundation CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Build KINGAI CLI
        run: go build -trimpath -o dist/kingai ./cmd/kingai
      - name: Vet core
        run: go vet ./...
      - name: Validate shell scripts
        run: bash -n scripts/*.sh
      - name: Check required files
        run: |
          test -f README.md
          test -f VERSION
          test -f SECURITY.md
          test -f docs/ARCHITECTURE.md
          test -f docs/ROADMAP.md
          test -f docs/LEGAL.md
          test -f profiles/server.yaml
          test -f profiles/desktop.yaml
          test -f profiles/iot.yaml
      - name: Show version
        run: ./dist/kingai version
