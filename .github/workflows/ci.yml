name: KINGAI OS Foundation CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Build KINGAI binaries
        run: |
          mkdir -p dist
          go build -trimpath -o dist/kingai ./cmd/kingai
          go build -trimpath -o dist/kingaid ./cmd/kingaid
          go build -trimpath -o dist/kingai-update ./cmd/kingai-update
          go build -trimpath -o dist/kingai-installer ./cmd/kingai-installer
          go build -trimpath -o dist/kingai-recovery ./cmd/kingai-recovery
      - name: Unit tests
        run: go test ./...
      - name: Vet core
        run: go vet ./...
      - name: Validate shell and JSON control files
        run: |
          bash -n scripts/*.sh desktop/welcome/*.sh
          sh -n distro/overlay/usr/lib/kingai/kingai-health-scan
          python3 - <<'PY'
          import json
          from pathlib import Path
          paths = [
              Path('configs/policy.json'), Path('configs/agents.json'),
              Path('configs/models.json'), Path('configs/system.json'),
              Path('release/gates.json'),
          ]
          for path in paths:
              json.loads(path.read_text())
          gates = json.loads(Path('release/gates.json').read_text())
          assert gates.get('schema') == 1
          for key, value in gates.items():
              if key not in {'schema', 'notes'}:
                  assert isinstance(value, bool), (key, value)
          PY
      - name: Test release control regressions
        run: bash scripts/test-release-gate-freshness.sh
      - name: Check required files and runtime defaults
        run: |
          test -f README.md
          test -f VERSION
          test -f LICENSE
          test -f NOTICE
          test -f SECURITY.md
          test -f profiles/server.yaml
          test -f profiles/desktop.yaml
          test -f profiles/iot.yaml
          test -f profiles/container.yaml
          test -f container/Dockerfile
          test -f configs/policy.json
          test -f configs/agents.json
          test -f configs/models.json
          test -f configs/system.json
          test -f systemd/kingaid.service
          grep -q '^Environment=KINGAI_REQUIRE_EXECD=true$' systemd/kingaid.service
          grep -q '^Environment=KINGAI_TASK_RUN_BUDGET=64$' systemd/kingaid.service
          test -f systemd/kingai-update-health.service
          test -f distro/overlay/usr/lib/systemd/system/kingai-health-scan.service
          test -f distro/overlay/usr/lib/systemd/system/kingai-health-scan.timer
          test -f distro/overlay/usr/lib/kingai/kingai-health-scan
          test -f scripts/build-rootfs.sh
          test -f scripts/build-live-iso.sh
          test -f scripts/build-iot-image.sh
          test -f scripts/build-container.sh
          test -f scripts/check-release-gate-freshness.sh
          test -f scripts/test-release-gate-freshness.sh
          test -f scripts/release-base-version.sh
          test -f scripts/test-release-base-version.sh
          test -f tools/ci/make-tuf-root/main.go
          test -f update/README.md
          test -f installer/README.md
          test -f iot/README.md
          test -f trust/tuf/README.md
          test -f release/gates.json
      - name: Smoke test CLI
        run: |
          ./dist/kingai version
          ./dist/kingai desktop list
          ./dist/kingai policy check filesystem.read
          ./dist/kingai-installer version
          ./dist/kingai-update --help >/dev/null 2>&1 || test $? -eq 2
          ./dist/kingai-recovery 2>/dev/null || test $? -eq 2
      - name: End-to-end kingaid D5 local runtime smoke
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          export KINGAI_SOCKET="$tmp/kingaid.sock"
          export KINGAI_POLICY="$PWD/configs/policy.json"
          export KINGAI_AGENTS="$PWD/configs/agents.json"
          export KINGAI_MODELS="$PWD/configs/models.json"
          export KINGAI_AUDIT="$tmp/audit.jsonl"
          export KINGAI_PUBLIC_STATUS="$tmp/public-status.json"
          export KINGAI_APPROVAL_ROOT="$tmp/approvals"
          export KINGAI_MEMORY_ROOT="$tmp/memory"
          export KINGAI_TASK_ROOT="$tmp/tasks"
          export KINGAI_REQUIRE_EXECD=false
          export KINGAI_TASK_RUN_BUDGET=64
          ./dist/kingaid >"$tmp/kingaid.log" 2>&1 &
          pid=$!
          cleanup() { kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; rm -rf "$tmp"; }
          trap cleanup EXIT
          for _ in $(seq 1 50); do [[ -S "$KINGAI_SOCKET" && -f "$KINGAI_PUBLIC_STATUS" ]] && break; sleep 0.1; done
          test -S "$KINGAI_SOCKET"; test -f "$KINGAI_PUBLIC_STATUS"

          curl --fail --silent --show-error --unix-socket "$KINGAI_SOCKET" http://kingai/healthz > "$tmp/health.json"
          curl --fail --silent --show-error --unix-socket "$KINGAI_SOCKET" http://kingai/readyz > "$tmp/ready.json"
          curl --fail --silent --show-error --unix-socket "$KINGAI_SOCKET" http://kingai/v1/status > "$tmp/status.json"
          curl --fail --silent --show-error --unix-socket "$KINGAI_SOCKET" http://kingai/v1/model/status > "$tmp/model-status.json"
          curl --fail --silent --show-error --unix-socket "$KINGAI_SOCKET" http://kingai/v1/runtime/adapters > "$tmp/adapter-status.json"
          curl --fail --silent --show-error --unix-socket "$KINGAI_SOCKET" -H 'Content-Type: application/json' -d '{"agent":"main","capability":"filesystem.read"}' http://kingai/v1/policy/evaluate > "$tmp/main-policy.json"
          curl --fail --silent --show-error --unix-socket "$KINGAI_SOCKET" -H 'Content-Type: application/json' -d '{"agent":"system-ops","capability":"service.restart"}' http://kingai/v1/policy/evaluate > "$tmp/spoof-policy.json"

          curl --fail --silent --show-error --unix-socket "$KINGAI_SOCKET" -H 'Content-Type: application/json' -d '{"agent":"main","kind":"task","sensitivity":"private","data":{"note":"runtime-smoke"}}' http://kingai/v1/memory/put > "$tmp/memory-put.json"
          curl --fail --silent --show-error --unix-socket "$KINGAI_SOCKET" http://kingai/v1/memory/list > "$tmp/memory-list.json"
          curl --fail --silent --show-error --unix-socket "$KINGAI_SOCKET" -H 'Content-Type: application/json' -d '{"agent":"main","goal":"verify D5 task graph"}' http://kingai/v1/tasks/create > "$tmp/task-create.json"
          task_id=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' "$tmp/task-create.json")
          curl --fail --silent --show-error --unix-socket "$KINGAI_SOCKET" -H 'Content-Type: application/json' -d "{\"id\":\"$task_id\",\"status\":\"planning\"}" http://kingai/v1/tasks/transition > "$tmp/task-planning.json"
          curl --fail --silent --show-error --unix-socket "$KINGAI_SOCKET" http://kingai/v1/tasks/list > "$tmp/task-list.json"

          sudo curl --fail --silent --show-error --unix-socket "$KINGAI_SOCKET" -H 'Content-Type: application/json' -d '{"agent":"system-ops","capability":"package.install","target":"nginx","ttl_seconds":60}' http://kingai/v1/approval/request > "$tmp/approval-request.json"
          approval_id=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' "$tmp/approval-request.json")
          sudo curl --fail --silent --show-error --unix-socket "$KINGAI_SOCKET" -H 'Content-Type: application/json' -d "{\"id\":\"$approval_id\",\"action\":\"approve\"}" http://kingai/v1/approval/decision > "$tmp/approval-approved.json"
          sudo curl --fail --silent --show-error --unix-socket "$KINGAI_SOCKET" -H 'Content-Type: application/json' -d "{\"agent\":\"system-ops\",\"capability\":\"package.install\",\"target\":\"nginx\",\"approval_id\":\"$approval_id\"}" http://kingai/v1/policy/evaluate > "$tmp/approval-consumed.json"
          sudo curl --fail --silent --show-error --unix-socket "$KINGAI_SOCKET" -H 'Content-Type: application/json' -d "{\"agent\":\"system-ops\",\"capability\":\"package.install\",\"target\":\"nginx\",\"approval_id\":\"$approval_id\"}" http://kingai/v1/policy/evaluate > "$tmp/approval-reuse.json"

          set +e
          curl --silent --show-error --output "$tmp/model-select.txt" --write-out '%{http_code}' --unix-socket "$KINGAI_SOCKET" -H 'Content-Type: application/json' -d '{"capability":"chat","private":true}' http://kingai/v1/model/select > "$tmp/model-code.txt"
          set -e

          diag="$tmp/diagroot"
          mkdir -p "$diag/etc/kingai/update" "$diag/var/lib/kingai-state/kingai/update"
          printf 'NAME="KINGAI OS"\nID=kingai\n' > "$diag/etc/os-release"
          cp configs/policy.json "$diag/etc/kingai/policy.json"
          cp configs/system.json "$diag/etc/kingai/system.json"
          cp configs/agents.json "$diag/etc/kingai/agents.json"
          cp configs/models.json "$diag/etc/kingai/models.json"
          go run ./tools/ci/make-tuf-root --output "$diag/etc/kingai/update/root.json" --mode 0644
          cat > "$diag/var/lib/kingai-state/kingai/update/slots.json" <<'EOF'
          {"active_slot":"A","active_version":"0.1.0-ci","boot_attempts":0,"max_boot_attempts":3,"confirmed":true,"rollback_required":false,"updated_at":"2026-01-01T00:00:00Z"}
          EOF
          export KINGAI_DIAGNOSTIC_ROOT="$diag"
          ./dist/kingai doctor --json > "$tmp/doctor.json"
          ./dist/kingai status --json > "$tmp/cli-status.json"
          ./dist/kingai model status > "$tmp/cli-model-status.json"
          ./dist/kingai runtime adapters > "$tmp/cli-adapter-status.json"

          python3 - "$tmp" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          assert json.loads((root/'health.json').read_text())['ok'] is True
          ready = json.loads((root/'ready.json').read_text())
          assert ready['ready'] is True and ready['status'] == 'ready', ready
          components = {c['name']: c for c in ready['components']}
          assert components['execution_broker']['status'] == 'not_required'
          assert components['model_providers']['status'] == 'not_configured'
          assert components['runtime_adapters']['status'] == 'not_configured'
          assert components['audit_and_state']['ok'] is True
          status = json.loads((root/'status.json').read_text())
          assert status['name'] == 'KINGAI OS'
          assert status['architecture'] == 'D5-preview'
          assert status['runtime_ready'] is True
          assert status['runtime_health'] == 'ready'
          assert status['task_run_budget'] == 64
          assert status['approval_broker'] == 'enabled'
          assert status['task_graph'] == 'enabled'
          assert status['memory_service'] == 'enabled'
          assert json.loads((root/'model-status.json').read_text()) == []
          assert json.loads((root/'adapter-status.json').read_text()) == []
          assert json.loads((root/'cli-model-status.json').read_text()) == []
          assert json.loads((root/'cli-adapter-status.json').read_text()) == []
          assert json.loads((root/'main-policy.json').read_text())['allowed'] is True
          spoof = json.loads((root/'spoof-policy.json').read_text())
          assert spoof['allowed'] is False and 'identity' in spoof['reason']
          memories = json.loads((root/'memory-list.json').read_text())
          assert len(memories) == 1 and memories[0]['kind'] == 'task'
          assert json.loads((root/'task-planning.json').read_text())['status'] == 'planning'
          tasks = json.loads((root/'task-list.json').read_text())
          assert len(tasks) == 1 and tasks[0]['goal'] == 'verify D5 task graph'
          assert json.loads((root/'approval-approved.json').read_text())['status'] == 'approved'
          assert json.loads((root/'approval-consumed.json').read_text())['allowed'] is True
          reuse = json.loads((root/'approval-reuse.json').read_text())
          assert reuse['allowed'] is False and reuse['reason'] == 'approval token rejected'
          assert (root/'model-code.txt').read_text() == '503'
          public = json.loads((root/'public-status.json').read_text())
          assert public['product'] == 'KINGAI OS' and public['registered_agents'] >= 1
          lowered = (root/'public-status.json').read_text().lower()
          assert not any(word in lowered for word in ('prompt','token','secret','api_key','password','memory_content'))
          doctor = json.loads((root/'doctor.json').read_text())
          assert doctor['status'] == 'healthy' and doctor['score'] == 100, doctor
          checks = {c['id']: c for c in doctor['checks']}
          assert checks['daemon']['status'] == 'pass'
          assert checks['ab-state']['status'] == 'pass'
          assert checks['tuf-root']['status'] == 'pass'
          assert 'threshold 2' in checks['tuf-root']['summary']
          cli_status = json.loads((root/'cli-status.json').read_text())
          assert cli_status['name'] == 'KINGAI OS'
          PY
          test "$(stat -c '%a' "$KINGAI_PUBLIC_STATUS")" = 644
          test -s "$KINGAI_AUDIT"

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build KINGAI OS Container amd64
        run: docker build --file container/Dockerfile --tag kingai-os:ci .
      - name: Container runtime smoke
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name kingai-os-ci kingai-os:ci
          cleanup() { docker rm -f kingai-os-ci >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for _ in $(seq 1 30); do
            if docker exec kingai-os-ci kingai status --json > /tmp/kingai-container-status.json 2>/dev/null; then break; fi
            sleep 1
          done
          docker exec kingai-os-ci kingai version
          docker exec kingai-os-ci kingai status --json
          docker exec kingai-os-ci kingai memory put task '{"note":"container-smoke"}' > /tmp/kingai-container-memory.json
          docker exec kingai-os-ci kingai task create main verify container runtime > /tmp/kingai-container-task.json
          python3 - <<'PY'
          import json
          status=json.load(open('/tmp/kingai-container-status.json'))
          assert status['name']=='KINGAI OS'
          assert status['architecture']=='D5-preview'
          assert status['runtime_ready'] is True
          assert status['runtime_health']=='ready'
          memory=json.load(open('/tmp/kingai-container-memory.json'))
          assert memory['kind']=='task'
          task=json.load(open('/tmp/kingai-container-task.json'))
          assert task['goal']=='verify container runtime'
          PY
          test "$(docker inspect --format '{{.Config.User}}' kingai-os-ci)" = "_kingai:kingai"
