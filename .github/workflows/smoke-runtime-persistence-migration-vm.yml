name: KINGAI OS Runtime Persistence Migration VM Smoke

on:
  push:
    branches: [main]
    paths:
      - 'cmd/kingai-update/**'
      - 'internal/update/**'
      - 'internal/installer/**'
      - 'systemd/kingaid.service'
      - 'systemd/kingai-update-health.service'
      - 'scripts/build-rootfs.sh'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/smoke-runtime-persistence-migration-vm.yml'
  workflow_dispatch:

concurrency:
  group: kingai-runtime-persistence-migration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  migrate-legacy-server-amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false

      - name: Install build update and VM tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            mmdebstrap ubuntu-keyring zstd gdisk parted dosfstools e2fsprogs \
            cryptsetup-bin rsync grub-efi-amd64-bin grub2-common \
            qemu-utils qemu-system-x86 ovmf jq

      - name: Build installer updater and Server rootfs
        run: |
          mkdir -p ci
          go build -trimpath -o ci/kingai-installer ./cmd/kingai-installer
          go build -trimpath -o ci/kingai-update ./cmd/kingai-update
          sudo --preserve-env=PATH,KINGAI_SKIP_ARCHIVE KINGAI_SKIP_ARCHIVE=1 \
            bash scripts/build-rootfs.sh server amd64 dist
          test -x dist/rootfs-server-amd64/usr/lib/kingai/kingai-update

      - name: Install fresh disk then emulate Beta.6 legacy runtime layout
        shell: bash
        run: |
          set -euo pipefail
          truncate -s 26G ci/persistence-test.raw
          sudo modprobe nbd max_part=16
          sudo qemu-nbd --connect=/dev/nbd0 --format=raw ci/persistence-test.raw
          sudo udevadm settle
          head -c 64 /dev/urandom > ci/state.key
          chmod 600 ci/state.key
          sudo env \
            KINGAI_INSTALLER_ALLOW_WRITE=1 \
            KINGAI_INSTALLER_CI=1 \
            KINGAI_INSTALLER_TEST_PERSIST_KEY=1 \
            ./ci/kingai-installer execute \
              --target /dev/nbd0 \
              --profile server \
              --source-root "$PWD/dist/rootfs-server-amd64" \
              --state-key "$PWD/ci/state.key" \
              --confirm ERASE:/dev/nbd0 > ci/install.json
          jq -e '.active_slot == "A"' ci/install.json >/dev/null

          sudo mkdir -p ci/legacy-a ci/legacy-b ci/state
          sudo mount /dev/nbd0p2 ci/legacy-a
          sudo mount /dev/nbd0p3 ci/legacy-b
          sudo cryptsetup open --key-file ci/state.key /dev/nbd0p4 KINGAI_STATE_CHECK
          sudo mount /dev/mapper/KINGAI_STATE_CHECK ci/state

          # Prove the fixed installer created the new encrypted layout marker first.
          sudo test -f ci/state/kingai/runtime/.layout-v1-ready
          sudo grep -Fq 'origin=fresh-install' ci/state/kingai/runtime/.layout-v1-ready

          # Now deliberately recreate the pre-fix Beta.6 disk semantics.
          sudo rm -f ci/state/kingai/runtime/.layout-v1-ready
          for root in ci/legacy-a ci/legacy-b; do
            sudo sed -i \
              -e '\| /var/lib/kingai-state |d' \
              -e '\| /var/lib/kingai |d' \
              -e '\| /var/log/kingai |d' \
              "$root/etc/fstab"
            echo '/dev/mapper/KINGAI_STATE /var/lib/kingai-state ext4 defaults,nofail 0 2' | sudo tee -a "$root/etc/fstab" >/dev/null
          done
          sudo mkdir -p ci/legacy-a/var/lib/kingai/memory ci/legacy-a/var/log/kingai
          echo 'legacy-memory-from-slot-a' | sudo tee ci/legacy-a/var/lib/kingai/memory/legacy-probe.txt >/dev/null
          echo 'legacy-audit-from-slot-a' | sudo tee ci/legacy-a/var/log/kingai/legacy-audit.log >/dev/null
          sudo sync

          sudo umount ci/state ci/legacy-b ci/legacy-a
          sudo cryptsetup close KINGAI_STATE_CHECK

      - name: Stage fixed B and require migration guard
        shell: bash
        run: |
          set -euo pipefail
          sudo cp -a dist/rootfs-server-amd64 ci/root-v2
          sudo sed -i 's/^VERSION_ID=.*/VERSION_ID="0.1.1-persistence-ci"/' ci/root-v2/usr/lib/os-release
          sudo tee ci/root-v2/usr/lib/kingai/kingai-persistence-ci-marker >/dev/null <<'EOF'
          #!/bin/sh
          set -eu
          mountpoint -q /var/lib/kingai-state
          mountpoint -q /var/lib/kingai
          mountpoint -q /var/log/kingai
          findmnt -rn -T /var/lib/kingai -o SOURCE | grep -Fq 'KINGAI_STATE'
          findmnt -rn -T /var/log/kingai -o SOURCE | grep -Fq 'KINGAI_STATE'
          test "$(cat /var/lib/kingai/memory/legacy-probe.txt)" = 'legacy-memory-from-slot-a'
          test "$(cat /var/log/kingai/legacy-audit.log)" = 'legacy-audit-from-slot-a'
          test -f /var/lib/kingai-state/kingai/runtime/.layout-v1-ready
          test ! -e /etc/kingai/state-migration.conf
          echo 'persisted-from-slot-b' > /var/lib/kingai/memory/post-migration-probe.txt
          sync
          echo KINGAI_RUNTIME_STATE_MIGRATION_OK > /dev/ttyS0
          systemctl --no-block poweroff
          EOF
          sudo chmod 0755 ci/root-v2/usr/lib/kingai/kingai-persistence-ci-marker
          sudo tee ci/root-v2/usr/lib/systemd/system/kingai-persistence-ci-marker.service >/dev/null <<'EOF'
          [Unit]
          Description=KINGAI encrypted runtime persistence CI marker
          After=kingai-update-health.service
          Requires=kingai-update-health.service
          [Service]
          Type=oneshot
          ExecStart=/usr/lib/kingai/kingai-persistence-ci-marker
          [Install]
          WantedBy=multi-user.target
          EOF
          sudo ln -sfn /usr/lib/systemd/system/kingai-persistence-ci-marker.service \
            ci/root-v2/etc/systemd/system/multi-user.target.wants/kingai-persistence-ci-marker.service

          sudo env KINGAI_UPDATE_ALLOW_WRITE=1 KINGAI_UPDATE_CI=1 \
            ./ci/kingai-update stage \
              --target-disk /dev/nbd0 \
              --source-root "$PWD/ci/root-v2" \
              --state-key "$PWD/ci/state.key" \
              --target-version 0.1.1-persistence-ci \
              --confirm UPDATE:/dev/nbd0 | tee ci/stage-v2.json
          jq -e '.from_slot == "A" and .target_slot == "B"' ci/stage-v2.json >/dev/null

          sudo mkdir -p ci/check-b
          sudo mount /dev/nbd0p3 ci/check-b
          grep -Fq '/dev/mapper/KINGAI_STATE /var/lib/kingai-state ext4 defaults 0 2' ci/check-b/etc/fstab
          grep -Fq '/var/lib/kingai-state/kingai/runtime/lib /var/lib/kingai none bind' ci/check-b/etc/fstab
          grep -Fq '/var/lib/kingai-state/kingai/runtime/log /var/log/kingai none bind' ci/check-b/etc/fstab
          if grep -Fq 'KINGAI_STATE /var/lib/kingai-state ext4 defaults,nofail' ci/check-b/etc/fstab; then
            echo 'target slot retained legacy optional STATE mount' >&2
            exit 1
          fi
          sudo test -f ci/check-b/etc/kingai/state-migration.conf
          sudo grep -Fq 'SOURCE_SLOT=A' ci/check-b/etc/kingai/state-migration.conf
          sudo test -f ci/check-b/usr/lib/systemd/system/kingai-state-migrate.service
          sudo test -f ci/check-b/usr/lib/systemd/system/kingaid.service.d/05-state-migrate.conf
          sudo umount ci/check-b

      - name: Boot B and migrate legacy runtime before kingaid
        shell: bash
        run: |
          set -euo pipefail
          sudo qemu-nbd --disconnect /dev/nbd0
          cp /usr/share/OVMF/OVMF_VARS_4M.fd ci/OVMF_VARS-migrate.fd
          set +e
          timeout 240 qemu-system-x86_64 \
            -machine q35 -m 2048 -smp 2 \
            -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd \
            -drive if=pflash,format=raw,file=ci/OVMF_VARS-migrate.fd \
            -drive file=ci/persistence-test.raw,format=raw,if=virtio \
            -display none -serial stdio -no-reboot > ci/qemu-migrate.log 2>&1
          code=$?
          set -e
          cat ci/qemu-migrate.log
          if [[ $code -ne 0 && $code -ne 124 ]]; then exit "$code"; fi
          # Ordinary systemd service stdout belongs to the journal, not ttyS0.
          # The CI marker writes directly to ttyS0 only after migration, health
          # confirmation and encrypted bind-mount checks have all succeeded.
          grep -Fq 'KINGAI_RUNTIME_STATE_MIGRATION_OK' ci/qemu-migrate.log

      - name: Verify migrated data lives inside encrypted STATE
        shell: bash
        run: |
          set -euo pipefail
          sudo qemu-nbd --connect=/dev/nbd0 --format=raw ci/persistence-test.raw
          sudo udevadm settle
          sudo cryptsetup open --key-file ci/state.key /dev/nbd0p4 KINGAI_STATE_CHECK
          sudo mkdir -p ci/state ci/check-b
          sudo mount /dev/mapper/KINGAI_STATE_CHECK ci/state
          sudo mount /dev/nbd0p3 ci/check-b
          sudo test "$(sudo cat ci/state/kingai/runtime/lib/memory/legacy-probe.txt)" = 'legacy-memory-from-slot-a'
          sudo test "$(sudo cat ci/state/kingai/runtime/log/legacy-audit.log)" = 'legacy-audit-from-slot-a'
          sudo test "$(sudo cat ci/state/kingai/runtime/lib/memory/post-migration-probe.txt)" = 'persisted-from-slot-b'
          sudo grep -Fq 'layout=1' ci/state/kingai/runtime/.layout-v1-ready
          sudo grep -Fq 'source_slot=A' ci/state/kingai/runtime/.layout-v1-ready
          sudo test ! -e ci/check-b/etc/kingai/state-migration.conf
          sudo jq -e '.active_slot == "B" and .confirmed == true and (.pending_slot // "") == ""' \
            ci/state/kingai/update/slots.json >/dev/null
          sudo umount ci/check-b ci/state
          sudo cryptsetup close KINGAI_STATE_CHECK

      - name: Stage next A and prove migration is not repeated
        shell: bash
        run: |
          set -euo pipefail
          sudo cp -a dist/rootfs-server-amd64 ci/root-v3
          sudo sed -i 's/^VERSION_ID=.*/VERSION_ID="0.1.2-persistence-ci"/' ci/root-v3/usr/lib/os-release
          sudo env KINGAI_UPDATE_ALLOW_WRITE=1 KINGAI_UPDATE_CI=1 \
            ./ci/kingai-update stage \
              --target-disk /dev/nbd0 \
              --source-root "$PWD/ci/root-v3" \
              --state-key "$PWD/ci/state.key" \
              --target-version 0.1.2-persistence-ci \
              --confirm UPDATE:/dev/nbd0 | tee ci/stage-v3.json
          jq -e '.from_slot == "B" and .target_slot == "A"' ci/stage-v3.json >/dev/null
          sudo mkdir -p ci/check-a
          sudo mount /dev/nbd0p2 ci/check-a
          sudo test ! -e ci/check-a/etc/kingai/state-migration.conf
          sudo test ! -e ci/check-a/usr/lib/systemd/system/kingai-state-migrate.service
          sudo test ! -e ci/check-a/usr/lib/systemd/system/kingaid.service.d/05-state-migrate.conf
          grep -Fq '/var/lib/kingai-state/kingai/runtime/lib /var/lib/kingai none bind' ci/check-a/etc/fstab
          grep -Fq '/var/lib/kingai-state/kingai/runtime/log /var/log/kingai none bind' ci/check-a/etc/fstab
          sudo umount ci/check-a
          sudo qemu-nbd --disconnect /dev/nbd0

      - name: Cleanup
        if: always()
        run: |
          mount | awk '$3 ~ /ci\/(legacy-a|legacy-b|state|check-a|check-b)$/ {print $3}' | sort -r | xargs -r sudo umount || true
          sudo cryptsetup close KINGAI_STATE_CHECK 2>/dev/null || true
          sudo qemu-nbd --disconnect /dev/nbd0 2>/dev/null || true
