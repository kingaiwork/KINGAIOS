name: KINGAI OS Server RootFS Smoke

on:
  push:
    branches: [main]
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'configs/**'
      - 'systemd/**'
      - 'sysusers/**'
      - 'distro/packages/server.txt'
      - 'distro/packages/installer-common.txt'
      - 'distro/packages/installer-amd64.txt'
      - 'distro/overlay/**'
      - 'scripts/build-rootfs.sh'
      - 'profiles/server.yaml'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/smoke-server-rootfs.yml'
  pull_request:
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'configs/**'
      - 'systemd/**'
      - 'sysusers/**'
      - 'distro/packages/server.txt'
      - 'distro/packages/installer-common.txt'
      - 'distro/packages/installer-amd64.txt'
      - 'distro/overlay/**'
      - 'scripts/build-rootfs.sh'
      - 'profiles/server.yaml'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/smoke-server-rootfs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server-amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Install rootfs tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y mmdebstrap ubuntu-keyring zstd
      - name: Build Ubuntu 26.04 based Server RootFS
        run: sudo --preserve-env=PATH,KINGAI_SKIP_ARCHIVE KINGAI_SKIP_ARCHIVE=1 bash scripts/build-rootfs.sh server amd64 dist
      - name: Validate Server trust and runtime composition
        shell: bash
        run: |
          set -euo pipefail
          root=dist/rootfs-server-amd64

          sudo chroot "$root" /usr/bin/kingai version
          sudo test -x "$root/usr/lib/kingai/kingaid"
          sudo test -x "$root/usr/lib/kingai/kingai-execd"
          sudo test -x "$root/usr/lib/kingai/kingai-update"
          sudo test -x "$root/usr/lib/kingai/kingai-installer"
          sudo test -x "$root/usr/lib/kingai/kingai-recovery"

          sudo test -f "$root/usr/lib/systemd/system/kingaid.service"
          sudo test -f "$root/usr/lib/systemd/system/kingai-execd.service"
          sudo test -f "$root/usr/lib/systemd/system/kingaid.service.d/10-execd.conf"
          grep -q '^User=_kingai$' "$root/usr/lib/systemd/system/kingaid.service"
          grep -q '^NoNewPrivileges=yes$' "$root/usr/lib/systemd/system/kingaid.service"
          grep -q '^Environment=KINGAI_REQUIRE_EXECD=true$' "$root/usr/lib/systemd/system/kingaid.service"
          grep -q '^After=kingai-execd.service$' "$root/usr/lib/systemd/system/kingaid.service.d/10-execd.conf"
          grep -q '^Wants=kingai-execd.service$' "$root/usr/lib/systemd/system/kingaid.service.d/10-execd.conf"
          grep -q '^User=root$' "$root/usr/lib/systemd/system/kingai-execd.service"
          grep -q '^RestrictAddressFamilies=AF_UNIX$' "$root/usr/lib/systemd/system/kingai-execd.service"
          grep -q '^CapabilityBoundingSet=$' "$root/usr/lib/systemd/system/kingai-execd.service"

          sudo test -L "$root/etc/systemd/system/multi-user.target.wants/kingaid.service"
          sudo test -L "$root/etc/systemd/system/multi-user.target.wants/kingai-execd.service"
          sudo test -L "$root/etc/systemd/system/multi-user.target.wants/kingai-update-health.service"

          sudo test -f "$root/etc/kingai/policy.json"
          sudo test -f "$root/etc/kingai/agents.json"
          sudo test -f "$root/etc/kingai/models.json"
          sudo test -f "$root/usr/share/kingai/legal/KINGAI-OS.spdx.json"
          sudo test ! -e "$root/usr/share/plasma/plasmoids/org.kingai.agentcenter"

          test "$(sudo stat -c '%u:%g' "$root")" = '0:0'
          leaked=$(sudo find "$root/etc/kingai" "$root/usr/lib/kingai" "$root/usr/share/kingai" -uid "$(id -u)" -print -quit)
          test -z "$leaked" || { echo "build-host ownership leaked into Server files: $leaked"; exit 1; }

          python3 - "$root/usr/share/kingai/legal/KINGAI-OS.spdx.json" <<'PY'
          import json, sys
          data=json.load(open(sys.argv[1]))
          assert data['spdxVersion'] == 'SPDX-2.3'
          assert data['SPDXID'] == 'SPDXRef-DOCUMENT'
          assert data['name'].startswith('KINGAI-OS-')
          assert any(
              p.get('SPDXID') == 'SPDXRef-Package-KINGAI-OS' and p.get('name') == 'KINGAI OS'
              for p in data.get('packages', [])
          )
          PY

          mib=$(sudo du -sm "$root" | awk '{print $1}')
          echo "Server rootfs MiB: $mib"
