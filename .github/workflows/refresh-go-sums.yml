name: KINGAI Go Module Integrity Refresh

on:
  push:
    branches: [main]
    paths:
      - 'go.mod'
      - '.github/workflows/refresh-go-sums.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tidy-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.23.x'
          cache: false
      - name: Resolve official module checksums
        env:
          GOPROXY: https://proxy.golang.org,direct
          GOSUMDB: sum.golang.org
        run: go mod tidy
      - name: Verify module graph builds
        run: |
          go mod verify
          go test ./...
      - name: Commit deterministic go.mod and go.sum if needed
        shell: bash
        run: |
          if git diff --quiet -- go.mod go.sum; then
            echo 'Go module metadata already clean.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add go.mod go.sum
          git commit -m 'lock TUF module checksums'
          git push origin HEAD:main
