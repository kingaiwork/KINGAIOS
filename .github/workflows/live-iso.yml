name: KINGAI OS Live ISO Build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Live ISO profile
        required: true
        type: choice
        default: server
        options: [server, desktop]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y mmdebstrap ubuntu-keyring zstd squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin grub-common mtools
      - name: Build root filesystem
        run: sudo --preserve-env=PATH bash scripts/build-rootfs.sh "${{ inputs.profile }}" amd64 dist
      - name: Build hybrid live ISO
        run: sudo --preserve-env=PATH bash scripts/build-live-iso.sh "${{ inputs.profile }}" dist
      - name: Normalize ownership
        run: sudo chown -R "$USER:$USER" dist
      - name: Validate installable preview image
        id: iso
        shell: bash
        run: |
          p=$(find dist -maxdepth 1 -name '*.iso' -print -quit)
          test -s "$p"
          sha256sum -c "$p.sha256"
          test -s "$p.manifest.json"
          test -s "$p.spdx.json"
          python3 - "$p.manifest.json" '${{ inputs.profile }}' <<'PY'
          import json, sys
          m=json.load(open(sys.argv[1]))
          profile=sys.argv[2]
          assert m['product']=='KINGAI OS'
          assert m['profile']==profile
          assert m['stage']=='installable-preview'
          assert m['installable'] is True
          assert m['installer']['entrypoint']=='kingai-install'
          assert m['boot_mode']==['UEFI','BIOS']
          PY
          echo "path=$p" >> "$GITHUB_OUTPUT"
      - name: Upload installable Live ISO
        uses: actions/upload-artifact@v4
        with:
          name: kingai-${{ inputs.profile }}-installable-live-iso
          path: |
            ${{ steps.iso.outputs.path }}
            ${{ steps.iso.outputs.path }}.sha256
            ${{ steps.iso.outputs.path }}.manifest.json
            ${{ steps.iso.outputs.path }}.spdx.json
          retention-days: 3

# Publishing is intentionally not supported here. The canonical, gated release
# path is .github/workflows/release.yml so RC/Stable cannot bypass release gates.
