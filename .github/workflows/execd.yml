name: KINGAI OS Execution Broker

on:
  pull_request:
    paths:
      - .github/workflows/execd.yml
      - cmd/kingai-execd/**
      - internal/executor/**
      - internal/audit/**
      - systemd/kingai-execd.service
      - scripts/build-rootfs.sh
      - scripts/build-foundation.sh
      - Makefile
      - go.mod
      - go.sum
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Build and test broker
        run: |
          go test ./internal/executor ./cmd/kingai-execd
          go vet ./internal/executor ./cmd/kingai-execd
          go build -trimpath -o dist-kingai-execd ./cmd/kingai-execd
      - name: Validate systemd sandbox declaration
        run: |
          grep -q '^User=root$' systemd/kingai-execd.service
          grep -q '^NoNewPrivileges=yes$' systemd/kingai-execd.service
          grep -q '^PrivateNetwork=yes$' systemd/kingai-execd.service
          grep -q '^ProtectSystem=strict$' systemd/kingai-execd.service
          grep -q '^RestrictAddressFamilies=AF_UNIX$' systemd/kingai-execd.service
          grep -q '^CapabilityBoundingSet=$' systemd/kingai-execd.service
          grep -q '^MemoryMax=128M$' systemd/kingai-execd.service
          grep -q '^TasksMax=32$' systemd/kingai-execd.service
          grep -q '^LimitNOFILE=256$' systemd/kingai-execd.service
      - name: Smoke constrained Unix execution broker
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          socket="$tmp/execd.sock"
          audit="$tmp/execd-audit.jsonl"
          allowed_user="$(id -un)"

          sudo env \
            KINGAI_EXECD_SOCKET="$socket" \
            KINGAI_EXECD_ALLOWED_USER="$allowed_user" \
            KINGAI_EXECD_AUDIT="$audit" \
            "$PWD/dist-kingai-execd" >"$tmp/execd.log" 2>&1 &
          pid=$!
          cleanup() {
            sudo kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            sudo rm -rf "$tmp"
          }
          trap cleanup EXIT

          for _ in $(seq 1 50); do [[ -S "$socket" ]] && break; sleep 0.1; done
          test -S "$socket"
          test "$(stat -c '%a' "$socket")" = 600
          test "$(stat -c '%U' "$socket")" = "$allowed_user"

          curl --fail --silent --show-error --unix-socket "$socket" \
            http://kingai-execd/healthz > "$tmp/health.json"

          curl --fail --silent --show-error --unix-socket "$socket" \
            -H 'Content-Type: application/json' \
            -d '{"agent":"system-ops","capability":"service.restart","target":"nginx.service;touch /tmp/kingai-execd-pwned"}' \
            http://kingai-execd/v1/execute > "$tmp/injection.json"

          curl --fail --silent --show-error --unix-socket "$socket" \
            -H 'Content-Type: application/json' \
            -d '{"agent":"system-ops","capability":"package.install","target":"curl"}' \
            http://kingai-execd/v1/execute > "$tmp/unknown.json"

          python3 - "$tmp" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          health = json.loads((root/'health.json').read_text())
          assert health['ok'] is True
          assert health['service'] == 'kingai-execd'
          assert health['capabilities'] == ['service.restart']

          injection = json.loads((root/'injection.json').read_text())
          assert injection['ok'] is False
          assert injection['message'] == 'invalid service unit'
          assert len(injection['execution_id']) == 32
          assert injection['agent'] == 'system-ops'
          assert injection['duration_ms'] >= 0

          unknown = json.loads((root/'unknown.json').read_text())
          assert unknown['ok'] is False
          assert 'not registered' in unknown['message']

          events = [json.loads(line) for line in (root/'execd-audit.jsonl').read_text().splitlines() if line.strip()]
          assert len(events) >= 2
          by_cap = {event.get('capability'): event for event in events}
          assert by_cap['service.restart']['execution_id'] == injection['execution_id']
          assert by_cap['service.restart']['duration_ms'] >= 0
          PY

          test ! -e /tmp/kingai-execd-pwned
          sudo test -s "$audit"
