services:
  kingai:
    build:
      context: ..
      dockerfile: container/Dockerfile
    image: kingai-os:dev
    restart: unless-stopped
    volumes:
      - kingai-state:/var/lib/kingai
      - kingai-logs:/var/log/kingai
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /run/kingai:mode=1777
      - /tmp:mode=1777

volumes:
  kingai-state:
  kingai-logs:
