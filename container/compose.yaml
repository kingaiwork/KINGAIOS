services:
  kingai:
    build:
      context: ..
      dockerfile: container/Dockerfile
    image: kingai-os:dev
    restart: unless-stopped
    user: "10001:10001"
    volumes:
      - kingai-state:/var/lib/kingai
      - kingai-logs:/var/log/kingai
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    pids_limit: 256
    stop_grace_period: 15s
    tmpfs:
      - /run/kingai:rw,nosuid,nodev,noexec,mode=0750,uid=10001,gid=10001
      - /tmp:rw,nosuid,nodev,noexec,mode=1777

volumes:
  kingai-state:
  kingai-logs:
