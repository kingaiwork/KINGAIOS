profile: server
name: KINGAI OS Server
version_source: VERSION
base:
  lineage: ubuntu-26.04-lts
  architecture:
    - amd64
    - arm64
features:
  desktop: false
  cloud_init: true
  ssh: true
  local_ai_runtime: optional
  rootless_containers: true
  recovery: true
kingai:
  cli: true
  daemon: true
  policy_engine: true
  model_fabric: true
  memory_fabric: true
  agent_runtime: true
  audit: true
size_budget_mib:
  target: 1536
  warning: 1800
  hard: 2048
artifact:
  format: iso
  name: KINGAI-OS-Server-${VERSION}-${ARCH}.iso
