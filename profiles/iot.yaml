profile: iot
name: KINGAI OS IoT / Edge
version_source: VERSION
base:
  lineage: ubuntu-26.04-lts
  architecture:
    - arm64
    - amd64
features:
  desktop: false
  headless: true
  governed_runtime: true
  local_ai_runtime: optional
  generic_privileged_execd: false
  embedded_device_broker: true
  device_handler_transport: unix_socket
  generic_root_shell: false
  device_packs: true
  board_binding: true
  ota_updates: true
  recovery: true
kingai:
  cli: true
  daemon: true
  policy_engine: true
  approval_broker: true
  task_graph: true
  task_run_budget: 16
  model_fabric: true
  memory_fabric: true
  edge_agent_runtime: true
  device_capability_runtime: true
  audit: true
security:
  daemon_user: _kingai
  device_pack_owner: root
  handler_socket_mode: "0600"
  handler_namespace: /run/kingai-device
  management_tcp_default: false
size_budget_mib:
  target: 600
  warning: 750
  hard: 900
artifact:
  format: img.xz
  name: KINGAI-OS-IoT-${VERSION}-${ARCH}.img.xz
