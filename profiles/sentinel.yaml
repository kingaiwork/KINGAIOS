profile: sentinel
name: KINGAI OS Sentinel
edition: proactive-defense-intelligence
version_source: VERSION
base:
  lineage: ubuntu-26.04-lts
  architecture:
    - amd64
    - arm64
features:
  desktop: false
  cloud_init: true
  ssh: true
  visual_console: true
  visual_console_bind: 127.0.0.1
  local_ai_runtime: optional
  rootless_containers: true
  recovery: true
  threat_intelligence: true
  network_detection: true
  endpoint_hardening: true
  authorized_validation: true
kingai:
  cli: true
  daemon: true
  policy_engine: true
  approval_broker: true
  task_graph: true
  model_fabric: true
  memory_fabric: true
  agent_runtime: true
  audit: true
  sentinel_ui: true
  sentinel_policy: /etc/kingai/sentinel.json
security:
  default_mode: defensive
  active_testing: authorized-assets-only
  unknown_targets: deny
  privileged_actions: approval-required
  execution: sandboxed
  audit: append-only
  management_tcp: disabled
  dashboard_remote_access: ssh-tunnel-or-authenticated-reverse-proxy
size_budget_mib:
  target: 2048
  warning: 2560
  hard: 3072
artifact:
  format: iso
  name: KINGAI-OS-Sentinel-${VERSION}-${ARCH}.iso
